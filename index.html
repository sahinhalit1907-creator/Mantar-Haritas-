<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantar Haritası</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3b34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantar">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">

<style>
  :root {
    --moss: #1f3b34;
    --lichen: #e8ece4;
    --paper: #fbfcfa;
    --ink: #1b2420;
    --muted: #5f6b65;
    --line: #d3dacf;

    --c-yenilebilir: #2e8b57;
    --c-zehirli: #c62f2f;
    --c-tibbi: #2f6fb5;
    --c-supheli: #e0a21b;
    --c-yenmez: #7a8580;
    --c-olumcul: #2a1a2e;

    --radius: 14px;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--lichen); overflow: hidden; }
  #map { position: fixed; inset: 0; z-index: 0; }

  /* ---------- Üst çubuk ---------- */
  .topbar {
    position: fixed; z-index: 500;
    top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .brand {
    pointer-events: auto; background: var(--moss); color: #fff;
    padding: 11px 16px; border-radius: 999px;
    font-weight: 800; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  @media (max-width: 640px) { .brand { display: none; } }

  .search { position: relative; flex: 1; max-width: 480px; pointer-events: auto; }
  .search input {
    font: inherit; font-size: 16px; width: 100%;
    padding: 11px 40px 11px 42px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
    box-shadow: 0 2px 10px rgba(0,0,0,.14);
  }
  .search .ico { position: absolute; left: 14px; top: 13px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .search .clear {
    position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: transparent; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer;
  }
  .search .clear[hidden] { display: none; }

  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    margin: 0; padding: 4px; list-style: none;
    background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0,0,0,.18); max-height: 55vh; overflow-y: auto;
  }
  .results[hidden] { display: none; }
  .results li {
    padding: 9px 10px; border-radius: 10px; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
  }
  .results li[aria-selected="true"], .results li:hover { background: var(--lichen); }
  .r-main { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .r-main span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c, var(--moss)); }
  .r-tag { font-size: 12px; color: var(--moss); background: var(--lichen); border-radius: 999px; padding: 2px 8px; font-weight: 600; }
  .r-sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .filters {
    display: flex; gap: 6px; pointer-events: auto; overflow-x: auto; padding: 2px 2px 6px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 600; flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    background: var(--paper); color: var(--ink);
    border: 1.5px solid var(--line); cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,.1);
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .chip[aria-pressed="false"] { opacity: .5; }
  .chip.lit { background: var(--moss); color: #fff; border-color: var(--moss); }
  .chip.lit[aria-pressed="false"] { background: var(--paper); color: var(--ink); border-color: var(--line); }
  .chip.lit .n { opacity: .8; font-weight: 400; }
  .chip[hidden] { display: none; }
  .acct-btn { pointer-events: auto; flex: none; position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--paper); color: var(--moss); display: grid; place-items: center; font: inherit; font-weight: 800; font-size: 17px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .acct-btn svg { width: 22px; height: 22px; }
  .acct-btn.in { background: var(--moss); color: #fff; }
  .acct-btn .dot { position: absolute; top: 5px; right: 5px; width: 11px; height: 11px; border-radius: 50%; background: #e0a21b; border: 2px solid #fff; }
  .acct-btn .dot[hidden] { display: none; }
  @media (max-width: 400px) { .guide-btn .gt { display: none; } .guide-btn { padding: 11px 13px; } }
  .sharebox { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
  .sharebox[hidden] { display: none; }
  .mdl { position: fixed; inset: 0; z-index: 1700; background: rgba(10,14,12,.55); display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 640px) { .mdl { align-items: center; } }
  .mdl-box { background: var(--paper); width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  @media (min-width: 640px) { .mdl-box { border-radius: 20px; } }
  .mdl-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 6px; }
  .mdl-head h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .mdl-body { padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
  .mdl-p { margin: 0; font-size: 14px; line-height: 1.5; }
  .mdl-small { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
  .mdl-msg { margin: 0; min-height: 1.2em; font-size: 13.5px; color: #8a3b00; }
  .mdl-body .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.danger { background: transparent; color: var(--c-zehirli); border-color: var(--c-zehirli); }
  .mdl-body input, .mdl-body select, .mdl-body textarea { font: inherit; font-size: 16px; width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  .sep { width: 1px; background: var(--line); flex: none; margin: 4px 2px; }

  .chip:focus-visible, .btn:focus-visible, .seg label:focus-within, input:focus-visible,
  select:focus-visible, textarea:focus-visible, .icon-btn:focus-visible, .clear:focus-visible,
  .leaflet-bar a:focus-visible { outline: 3px solid #7fb5a6; outline-offset: 2px; }

  /* ---------- Alt kontroller ---------- */
  .fab {
    position: fixed; z-index: 500; left: 50%; transform: translateX(-50%);
    bottom: max(18px, env(safe-area-inset-bottom));
    background: var(--moss); color: #fff; border: 0;
    font: inherit; font-weight: 700; font-size: 15px;
    padding: 13px 20px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(31,59,52,.35);
  }
  .fab[hidden] { display: none; }
  .hint {
    position: fixed; z-index: 400; left: 50%; transform: translateX(-50%);
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 62px);
    background: rgba(251,252,250,.95); color: var(--muted);
    font-size: 13px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .hint[hidden] { display: none; }
  .perm {
    position: fixed; z-index: 450; left: 10px; right: 10px; margin: 0 auto; max-width: 440px;
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 62px);
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 12px 14px; box-shadow: 0 10px 28px rgba(0,0,0,.2); font-size: 14px;
  }
  .perm[hidden] { display: none; }
  .perm p { margin: 0 0 10px; line-height: 1.4; }
  .perm .acts { display: flex; gap: 8px; }
  .perm ul { margin: 0 0 10px; padding-left: 18px; font-size: 13.5px; line-height: 1.5; display: grid; gap: 4px; }
  .perm ul:empty { display: none; }
  .perm .diag { margin: 0 0 10px; font-size: 11.5px; color: var(--muted); }
  .perm .acts { flex-wrap: wrap; }
  .perm button[hidden] { display: none; }

  .leaflet-top.leaflet-right { top: 56px; }
  @media (max-width: 640px) { .leaflet-top.leaflet-right { top: 112px; } }
  .leaflet-bar a.loc svg { display: block; margin: 5px auto; width: 20px; height: 20px; }

  /* ---------- Form paneli ---------- */
  .sheet {
    position: fixed; z-index: 1000; background: var(--paper);
    display: flex; flex-direction: column;
    left: 0; right: 0; bottom: 0; max-height: 88vh;
    border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.2);
    transform: translateY(105%); transition: transform .25s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 760px) {
    .sheet { top: 0; bottom: 0; left: 0; right: auto; width: 410px; max-height: none; border-radius: 0 20px 20px 0; transform: translateX(-105%); }
    .sheet.open { transform: translateX(0); }
  }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
  .sheet-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .coords { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .icon-btn { border: 0; background: var(--lichen); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
  .sheet-body { overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 16px; }

  .field { display: flex; flex-direction: column; gap: 6px; position: relative; }
  .field > label, .legend { font-size: 14px; font-weight: 600; }
  .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
  input[type="text"], input[type="date"], select, textarea {
    font: inherit; font-size: 16px; width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  }
  textarea { resize: vertical; min-height: 76px; }

  .btn {
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    border-radius: 10px; padding: 12px 16px; border: 1.5px solid var(--moss);
    background: var(--moss); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--moss); }
  .btn.small { padding: 7px 11px; font-size: 13px; }

  .suggest {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 20;
    margin: 4px 0 0; padding: 4px; list-style: none;
    background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 24px rgba(0,0,0,.14); max-height: 260px; overflow-y: auto;
  }
  .suggest li { padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .suggest li[aria-selected="true"], .suggest li:hover { background: var(--lichen); }
  .suggest .s-main { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .suggest .s-sub { font-size: 13px; color: var(--muted); }
  .suggest .s-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .suggest .s-new { font-weight: 600; color: var(--moss); }

  .match { font-size: 14px; background: var(--lichen); border-radius: 10px; padding: 9px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .match[hidden] { display: none; }
  .match em { font-style: italic; font-weight: 600; }
  .match button { border: 0; background: none; color: var(--moss); font: inherit; font-weight: 700; cursor: pointer; }

  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--moss); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border: 0; margin: 0; padding: 0; }
  .seg legend { padding: 0; margin-bottom: 6px; }
  .seg label {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 14px;
    border: 1.5px solid var(--line); background: #fff;
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .seg label:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, #fff); box-shadow: inset 0 0 0 1px var(--c); }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 380px) { .two { grid-template-columns: 1fr; } }

  .photo-row { display: flex; gap: 12px; align-items: center; }
  .photo-row img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1.5px solid var(--line); }
  .photo-row img[hidden] { display: none; }
  .photo-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .sheet-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .disclaimer { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }

  /* ---------- Popup ---------- */
  .leaflet-popup-content-wrapper { border-radius: 14px; font-family: var(--font); }
  .leaflet-popup-content { margin: 12px 14px; min-width: 200px; max-height: 60vh; overflow-y: auto; }
  .pop h3 { margin: 0 0 2px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .pop .latin { margin: 0 0 8px; font-style: italic; color: var(--muted); font-size: 14px; }
  .pop .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .pop .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700; background: var(--c); }
  .pop .badge.src { background: var(--lichen); color: var(--moss); }
  .pop img { width: 100%; max-height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
  .pop dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
  .pop dt { color: var(--muted); }
  .pop dd { margin: 0; }
  .pop .note { margin: 8px 0 0; font-size: 13px; line-height: 1.4; }
  .pop .warn { margin: 8px 0 0; font-size: 12.5px; line-height: 1.4; color: #8a5a00; background: #fff4d6; border-radius: 8px; padding: 6px 8px; }
  .pop .srcnote { margin: 8px 0 0; font-size: 11.5px; line-height: 1.4; color: var(--muted); }
  .pop .del { margin-top: 10px; border: 0; background: none; color: var(--c-zehirli); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
  .pop .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pop a.lnk { font-size: 13px; color: var(--moss); font-weight: 600; align-self: center; }
  .pop .coord { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .pop ul.sp { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; display: grid; gap: 3px; }
  .pop ul.sp li { display: flex; gap: 7px; align-items: baseline; cursor: pointer; }
  .pop ul.sp li:hover { text-decoration: underline; }
  .pop ul.sp .d { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

  .pin { filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .pin.temp { animation: bob .9s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .pin.temp { animation: none; } .sheet { transition: none; } }

  .cl {
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: var(--moss); color: #fff; font-weight: 800; font-size: 13px;
    border: 3px solid rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .target { filter: drop-shadow(0 1px 3px rgba(0,0,0,.4)); }

  .toast {
    position: fixed; z-index: 2000; left: 50%; top: max(60px, calc(env(safe-area-inset-top) + 50px));
    transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 16px; font-size: 14px; font-weight: 600;
    max-width: 90vw; text-align: center; line-height: 1.35;
  }
  .toast[hidden] { display: none; }

  /* ---------- Rehber düğmesi ---------- */
  .guide-btn {
    pointer-events: auto; flex: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 15px;
    background: var(--moss); color: #fff; padding: 11px 16px; border-radius: 999px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 7px;
  }
  .guide-btn svg { width: 18px; height: 18px; }

  /* ---------- Mantar Rehberi ---------- */
  .guide { position: fixed; inset: 0; z-index: 1500; background: var(--lichen); display: flex; flex-direction: column; }
  .guide[hidden] { display: none; }
  .g-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 16px 6px; background: var(--moss); color: #fff; }
  .g-head h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .g-head .icon-btn { background: rgba(255,255,255,.16); color: #fff; }
  .g-tabs { display: flex; gap: 6px; padding: 6px 12px 12px; overflow-x: auto; background: var(--moss); scrollbar-width: none; }
  .g-tabs::-webkit-scrollbar { display: none; }
  .g-tab { font: inherit; font-size: 14px; font-weight: 600; flex: none; cursor: pointer;
    padding: 7px 14px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.35); background: transparent; color: #fff; }
  .g-tab[aria-selected="true"] { background: #fff; color: var(--moss); border-color: #fff; }
  .g-tab:focus-visible { outline: 3px solid #7fb5a6; outline-offset: 2px; }
  .g-body { flex: 1; overflow-y: auto; padding: 16px 14px calc(28px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .g-wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .g-h { margin: 6px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .g-note { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 14px; line-height: 1.5; }
  .g-note.warn { background: #fff4d6; border-color: #ecd28a; color: #5c4200; }
  .g-ctl { display: flex; flex-direction: column; gap: 10px; }
  .g-q { font: inherit; font-size: 16px; width: 100%; max-width: 420px; padding: 11px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  .g-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .g-chips .chip[aria-pressed="false"] { opacity: .6; }
  .g-chips .chip[aria-pressed="true"] { border-color: var(--ink); }
  .g-list { display: flex; flex-direction: column; gap: 26px; }
  .g-cat-head { display: flex; align-items: center; gap: 10px; }
  .g-cat-head h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .g-cat-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; }
  .g-count { font-size: 13px; color: var(--muted); background: #fff; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--line); }
  .g-intro { margin: 6px 0 12px; font-size: 14px; line-height: 1.5; color: var(--muted); max-width: 760px; }
  .g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .g-card { background: var(--paper); border: 1.5px solid var(--line); border-top: 4px solid var(--c); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .g-fig { margin: 0; position: relative; aspect-ratio: 4 / 3; background: color-mix(in srgb, var(--c) 14%, #fff); overflow: hidden; }
  .g-fig img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .g-ph { position: absolute; inset: 0; display: grid; place-items: center; }
  .g-ph svg { width: 46%; }
  .g-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: 11px;
    background: rgba(255,255,255,.88); color: var(--muted); }

<script>
(() => {
  'use strict';

  /* =========================================================
     1) Kategoriler
     ========================================================= */
  const CATS = {
    yenilebilir: { label: 'Yenilebilir', color: '#2e8b57' },
    zehirli:     { label: 'Zehirli',     color: '#c62f2f' },
    tibbi:       { label: 'Tıbbi',       color: '#2f6fb5' },
    supheli:     { label: 'Şüpheli',     color: '#e0a21b' },
    yenmez:      { label: 'Yenmez',      color: '#7a8580' },
    olumcul:     { label: 'Ölümcül',     color: '#2a1a2e' }
  };
  const CODE = { Y: 'yenilebilir', Z: 'zehirli', T: 'tibbi', S: 'supheli', N: 'yenmez', O: 'olumcul' };

  // Türkçe uyumlu normalizasyon: "Çörek" → "corek"
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

  // Topluluk (Supabase) ayarları config.js içindedir; boşsa uygulama yalnızca cihazda çalışır
  const CFG = window.MANTAR_CONFIG || {};
  const cloud = { configured: !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY), ok: false, sb: null, user: null };
  if (cloud.configured && window.supabase && window.supabase.createClient) {
    try {
      cloud.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
      cloud.ok = true;
    } catch { /* kitaplık yüklenemedi: yerel mod */ }
  }

  const norm = s => (s || '').toLocaleLowerCase('tr')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ı/g, 'i').trim();

  /* =========================================================
     2) KOORDİNAT ÇÖZÜMLEYİCİ
        Kabul edilen örnekler:
          37.0662, 37.3833
          37,0662 37,3833
          37°03′58″N 37°23′E     (K/G/D/B harfleri de olur)
          N 37 03 58  E 37 23 00
          Google Maps bağlantısı (…@37.06,37.38,…)
     ========================================================= */
  // <parse>
  function parseCoords(input) {
    if (!input) return null;
    let s = String(input).trim();
    const num = x => parseFloat(String(x).replace(',', '.'));
    const ok = (lat, lng) =>
      (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) ? { lat, lng } : null;

    // 1) Harita bağlantıları
    let m = s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) ||
            s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) ||
            s.match(/[?&](?:q|ll|query)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/);
    if (m) return ok(num(m[1]), num(m[2]));

    // 2) Yalnızca koordinata benzeyen karakterler kabul edilir
    s = s.replace(/[′’´`‘]/g, "'").replace(/[″”“]/g, '"').replace(/[º˚]/g, '°').replace(/''/g, '"');
    if (!/^[\s\d.,;:°'"+\-–—\/NSEWKGDBnsewkgdb]+$/.test(s)) return null;
    s = s.replace(/[–—;\/]/g, ' ');

    const hasSym = /[°'"]/.test(s);
    const hasLet = /[NSEWKGDB]/i.test(s);

    // 3) Ondalık: "37.0662, 37.3833"
    if (!hasSym && !hasLet) {
      const nums = s.match(/-?\d+(?:[.,]\d+)?/g);
      if (nums && nums.length === 2) {
        let a = num(nums[0]), b = num(nums[1]);
        if (Math.abs(a) > 90 && Math.abs(b) <= 90) [a, b] = [b, a];
        return ok(a, b);
      }
      return null;
    }

    // 4) Derece-dakika-saniye / harfli
    const t = s.replace(/,\s+/g, ' ');
    const N = '(\\d+(?:[.,]\\d+)?)';
    const sfx = new RegExp(`(-?)${N}\\s*°?\\s*(?:${N}\\s*'?\\s*)?(?:${N}\\s*"?\\s*)?([NSEWKGDB])(?![A-Za-z])`, 'gi');
    const pfx = new RegExp(`([NSEWKGDB])\\s*(-?)${N}\\s*°?\\s*(?:${N}\\s*'?\\s*)?(?:${N}\\s*"?\\s*)?`, 'gi');
    const sym = new RegExp(`(-?)${N}\\s*°\\s*(?:${N}\\s*'\\s*)?(?:${N}\\s*"\\s*)?`, 'g');
    const conv = (neg, d, mi, se) =>
      (num(d) + (mi ? num(mi) / 60 : 0) + (se ? num(se) / 3600 : 0)) * (neg ? -1 : 1);
    const isLat = L => /[NSKG]/.test(L);
    const isNeg = L => /[SGWB]/.test(L);

    let parts = [...t.matchAll(sfx)].map(x => ({ v: conv(x[1], x[2], x[3], x[4]), L: x[5].toUpperCase() }));
    if (parts.length !== 2) {
      parts = [...t.matchAll(pfx)].map(x => ({ v: conv(x[2], x[3], x[4], x[5]), L: x[1].toUpperCase() }));
    }
    if (parts.length === 2) {
      parts.forEach(p => { p.v = isNeg(p.L) ? -Math.abs(p.v) : p.v; });
      if (isLat(parts[0].L) && !isLat(parts[1].L)) return ok(parts[0].v, parts[1].v);
      if (!isLat(parts[0].L) && isLat(parts[1].L)) return ok(parts[1].v, parts[0].v);
      return null;
    }
    const sm = [...t.matchAll(sym)];
    if (sm.length === 2) return ok(conv(sm[0][1], sm[0][2], sm[0][3], sm[0][4]), conv(sm[1][1], sm[1][2], sm[1][3], sm[1][4]));
    return null;
  }
  // </parse>

  /* =========================================================
     3) MAKALE VERİSİ
        Kaynak: Kaya, A., Uzun, Y., Karacan, H. İ., Yakar, S. (2019).
        Contributions to the Macromycota of Gaziantep Province.
        Kastamonu Üniv. Orman Fak. Dergisi, 19(3): 329-341.

        - Koordinatlar makaledeki Tablo 1'den (derece-dakika) alınmıştır.
        - Tür kategorileri (Y/Z/T/S/N) makalede tür bazında verilmemiştir;
          genel mikolojik bilgiye göre atanmıştır. UZMAN DOĞRULAMASI GEREKİR.
        - Y yenilebilir, Z zehirli, O ölümcül, T tıbbi, S şüpheli/belirsiz, N yenmez
     ========================================================= */

  // [no, ad, enlem°, enlem′, boylam°, boylam′, rakım m]
  const LOC_RAW = [
    [1,'Araban, Emirhaydar',37,30,37,42,850],[2,'Araban, Eskialtuntaş',37,24,37,41,513],
    [3,'İslahiye, Alaca',36,59,36,49,1020],[4,'İslahiye, Altınüzüm',36,54,36,34,490],
    [5,'İslahiye, Çubuk',36,59,36,48,800],[6,'İslahiye, Fevzipaşa',37,6,36,37,675],
    [7,'İslahiye, Hanağzı',37,3,36,36,535],[8,'İslahiye, Hasanlök',36,54,36,30,815],
    [9,'İslahiye, Kozdere',37,6,36,39,750],[10,'İslahiye, Tandır',36,57,37,31,695],
    [11,'İslahiye, Tandır',36,58,36,29,1750],[12,'İslahiye, Tandır',36,57,37,29,1530],

    ...EXTRA.filter(e => !speciesByLatin.has(e.latin))
  ];
  const INDEX = SPECIES.flatMap(sp =>
    [{ text: sp.latin, kind: 'latin' }, ...sp.names.map(n => ({ text: n, kind: 'local' }))]
      .map(a => ({ ...a, norm: norm(a.text), sp })));

  function searchSpecies(query, { limit = 6, only } = {}) {
    const q = norm(query);
    if (q.length < 2) return [];
    const by = new Map();
    for (const a of INDEX) {
      if (only && !only(a.sp)) continue;
      const pos = a.norm.indexOf(q);
      if (pos === -1) continue;
      const score = pos === 0 ? 0 : 1;
      const prev = by.get(a.sp);
      if (!prev || score < prev.score) by.set(a.sp, { sp: a.sp, matched: a, score });
    }
    return [...by.values()].sort((x, y) => x.score - y.score).slice(0, limit);
  }

  /* =========================================================
     9) Konum: "Konumum" ve izin
     ========================================================= */
  let meLayer = null, meLL = null;

  function coordPopup(ll, label) {
    const root = el('div', 'pop');
    root.appendChild(el('h3', '', label || 'Seçilen nokta'));
    root.appendChild(el('p', 'coord', `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`));
    const acts = el('div', 'acts');

    add.addEventListener('click', () => { map.closePopup(); openForm(ll); });

    copy.addEventListener('click', () => copyText(`${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`));
    const a = el('a', 'lnk', 'Haritalar\'da aç'); a.target = '_blank'; a.rel = 'noopener';

  function copyText(t) {
    const done = () => toast('Koordinat kopyalandı');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast(t));
    else toast(t);
  }

  function showMe(ll, acc, label) {
    if (meLayer) map.removeLayer(meLayer);
    meLL = ll;
    const ring = L.circle(ll, { radius: acc, color: '#2f6fb5', weight: 1, fillColor: '#2f6fb5', fillOpacity: .12, interactive: false });
    const dot = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#2f6fb5', fillOpacity: 1 });
    dot.bindPopup(() => coordPopup(ll, label || `Buradasın (±${Math.round(acc)} m)`));
    meLayer = L.layerGroup([ring, dot]).addTo(map);
  }

  /* Konum: dokunma anında, araya başka bir adım girmeden getCurrentPosition çağrılır;
     tarayıcı/cihaz izin penceresini hemen gösterir. İzin engelliyse (tarayıcı tekrar sormaz)
     ayarları nasıl açacağını adım adım gösteren bir kart çıkar. */
  const locHelp = $('locHelp');
  let lastLocOpts = null;
  function hideLocHelp() { locHelp.hidden = true; }
  function showLocHelp(kind, diag) {
    const ua = navigator.userAgent || '';
    const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const android = /Android/i.test(ua);
    const webview = /; wv\)|FBAN|FBAV|Instagram|Line\/|MicroMessenger|Claude/i.test(ua);
    const proto = location.protocol.replace(':', '');
    const T = {
      origin: ['Bu adreste konum izni verilemiyor', `Sayfa şu an "${proto}://" adresinden (dosya yöneticisi/yerel dosya) açık. Chrome ve diğer tarayıcılar böyle güvenli olmayan adreslerde konum iznini hiç sormaz, kendiliğinden reddeder. Konum için sayfayı https ya da localhost üzerinden açman gerekir.`],
      denied: ['Konum izni kapalı', 'Tarayıcı, izin bir kez reddedilince pencereyi tekrar göstermez. İzni ayarlardan açıp tekrar dene.'],
      timeout: ['Konum alınamadı (zaman aşımı)', 'Açık alanda, GPS/konum servisi açıkken tekrar dene.'],
      unavailable: ['Konum belirlenemedi', 'Cihazın konum servisini (GPS) açıp tekrar dene.'],
      nogeo: ['Bu tarayıcı konumu desteklemiyor', 'Sayfayı Chrome, Safari ya da Firefox ile aç.']
    }[kind] || ['Konum alınamadı', ''];
    $('locHelpTitle').textContent = T[0]; $('locHelpText').textContent = T[1];
    const steps = [];
    if (kind === 'origin') {
      steps.push('Önerilen: index.html dosyasını ücretsiz bir https barındırmaya yükle (ör. GitHub Pages). Adres https:// olunca izin penceresi doğrudan açılır.',
                 'Alternatif: telefona bir "HTTP sunucu" uygulaması kur, dosyayı onunla sun ve Chrome\'da http://localhost:PORT/ adresini aç (localhost güvenli sayılır).',
                 'Şimdilik "Yaklaşık konumu bul" ile internet adresinden (IP) kabaca bir konum alabilirsin; bu GPS kadar doğru değildir.');
    }
    if (kind === 'denied') {
      if (ios) steps.push('Ayarlar → Gizlilik ve Güvenlik → Konum Servisleri → Safari Web Siteleri → "Uygulamayı Kullanırken".', 'Safari\'de adres çubuğundaki "aA" → Web Sitesi Ayarları → Konum → İzin Ver.');
      else if (android) steps.push('Adres çubuğunun solundaki ayar/kilit simgesine dokun → İzinler → Konum → İzin ver.', 'Telefonun Konum (GPS) özelliğinin açık olduğundan emin ol.');
      else steps.push('Adres çubuğundaki kilit/ayar simgesine tıkla → Konum → İzin ver, sonra sayfayı yenile.');
    }
    if (webview && kind !== 'origin') steps.push('Uygulama içi önizlemede konum çalışmayabilir; sayfayı normal bir tarayıcıda (Chrome/Safari) aç.');
    const ul = $('locHelpSteps'); ul.innerHTML = '';
    steps.forEach(s => ul.appendChild(el('li', '', s)));
    $('locHelpDiag').textContent = diag || '';
    $('locRetry').hidden = kind === 'origin' || kind === 'nogeo';
    $('locApprox').hidden = kind === 'nogeo';
    locHelp.hidden = false; $('hint').hidden = true;
  }

  /* Yaklaşık konum (GPS değil): IP adresinden şehir düzeyinde konum. Konum izni gerektirmez ve her adreste çalışır. */
  async function approxLocate() {
    toast('Yaklaşık konum aranıyor…');
    const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('zaman aşımı')), ms))]);
    const sources = [
      async () => { const j = await (await fetch('https://get.geojs.io/v1/ip/geo.json')).json(); return [parseFloat(j.latitude), parseFloat(j.longitude), j.city || j.region]; },
      async () => { const j = await (await fetch('https://ipwho.is/')).json(); if (!j.success) throw new Error('hata'); return [j.latitude, j.longitude, j.city]; },
      async () => { const j = await (await fetch('https://ipapi.co/json/')).json(); return [j.latitude, j.longitude, j.city]; }
    ];
    for (const s of sources) {
      try {
        const [lat, lng, city] = await withTimeout(s(), 7000);
        if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) continue;
        const ll = L.latLng(lat, lng);
        hideToast(); hideLocHelp();
        showMe(ll, 12000, `Yaklaşık konumun${city ? ' (' + city + ')' : ''}: internet adresine göre, GPS değil`);
        map.flyTo(ll, 10);
        toast('Yaklaşık konum bulundu (IP tabanlı). Tam konum için https/localhost gerekir.');
        return;
      } catch { /* sıradaki kaynağı dene */ }
    }
    hideToast(); toast('Yaklaşık konum alınamadı. İnternet bağlantını kontrol et ya da haritadan nokta seç.');
  }
  $('locApprox').addEventListener('click', approxLocate);

  $('locRetry').addEventListener('click', () => locateMe(lastLocOpts || {}));
  $('locHelpClose').addEventListener('click', () => { hideLocHelp(); if (!sheet.classList.contains('open')) $('hint').hidden = false; });

  function locateMe(opts = {}) {
    const { onFix, fly = true, quiet = false } = opts;
    if (!('geolocation' in navigator)) { if (!quiet) showLocHelp('nogeo'); return; }
    if (!quiet) { lastLocOpts = opts; hideLocHelp(); toast('Konum izni isteniyor…'); }
    navigator.geolocation.getCurrentPosition(pos => {
      hideToast(); hideLocHelp();
      const ll = L.latLng(pos.coords.latitude, pos.coords.longitude), acc = pos.coords.accuracy;
      showMe(ll, acc);
      if (fly) map.flyTo(ll, acc > 1500 ? 12 : Math.max(map.getZoom(), 16));
      if (onFix) onFix(ll);
    }, async err => {
      if (quiet) return;
      hideToast();
      let state = 'bilinmiyor';
      try { state = (await navigator.permissions.query({ name: 'geolocation' })).state; } catch {}
      const proto = location.protocol;
      const local = proto === 'content:' || proto === 'file:' || !window.isSecureContext;
      const diag = `Adres: ${proto}// · Güvenli bağlam: ${window.isSecureContext ? 'evet' : 'hayır'} · İzin durumu: ${state} · Hata kodu: ${err.code}`;
      // content:// ve güvenli olmayan adreslerde tarayıcı pencereyi hiç göstermeden reddeder
      const kind = err.code === 1 ? ((proto === 'content:' || (local && state !== 'denied')) ? 'origin' : 'denied') : err.code === 3 ? 'timeout' : 'unavailable';
      showLocHelp(kind, diag);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 });
  }

  // Haritanın sağ üstüne "Konumum" düğmesi
  const LocateCtl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {
      const c = L.DomUtil.create('div', 'leaflet-bar');
      const a = L.DomUtil.create('a', 'loc', c);
      a.href = '#'; a.title = 'Konumumu bul'; a.setAttribute('role', 'button'); a.setAttribute('aria-label', 'Konumumu bul');
      a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>';
      L.DomEvent.disableClickPropagation(c);
      L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); locateMe(); });
      return c;
    }
  });
  new LocateCtl().addTo(map);

  // İzin daha önce verilmişse konumu sessizce göster. Verilmemişse ara kart yok:
  // "Konumum" ya da "Bulunduğum yerden ekle" düğmesine dokununca izin penceresi doğrudan açılır.
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(p => {
      if (p.state === 'granted') locateMe({ quiet: true, fly: false });
    }).catch(() => {});
  }

  /* =========================================================
     10) ARAMA: koordinat, yer adı, mantar adı, lokalite
     ========================================================= */
  const qEl = $('q'), resEl = $('results'), clearQ = $('clearQ');
  let items = [], act = -1, searchMarker = null;

  function goTo(lat, lng, { label, zoom = 17, bbox } = {}) {
    const ll = L.latLng(lat, lng);
    if (bbox && bbox.length === 4) map.flyToBounds([[+bbox[0], +bbox[2]], [+bbox[1], +bbox[3]]], { maxZoom: 16 });
    else map.flyTo(ll, Math.max(zoom, 15));
    if (searchMarker) map.removeLayer(searchMarker);
    searchMarker = L.marker(ll, { icon: targetIcon, zIndexOffset: 900 }).addTo(map)
      .bindPopup(() => coordPopup(ll, label));
    setTimeout(() => searchMarker && searchMarker.openPopup(), 700);
  }

  function showSpecies(sp) {
    const lit = sp.lit;
    if (!lit) { toast('Bu tür makalede yok; yalnızca form sözlüğünde var.'); return; }
    const ms = litMarkers.filter(m => m.sp === lit);
    if (!ms.length) {
      const raw = lit.occ.map(o => o.raw).filter(Boolean).join(', ');
      toast(raw ? `${lit.latin} makalede var, ama lokalite numarası (“${raw}”) hatalı yazılmış; haritaya konamadı.` : `${lit.latin} için haritaya konabilen kayıt yok.`);
      return;
    }
    ensureVisible(lit.cat);
    if (ms.length === 1) goToMarker(ms[0]);
    else { map.fitBounds(L.latLngBounds(ms.map(m => m.getLatLng())).pad(0.35), { maxZoom: 15 }); toast(`${titleOf(lit)}: ${ms.length} kayıt`); }
  }

  /* ---- Arama sonucundan doğrudan kaydın koordinatına git ---- */
  const mDate = m => (m.isExtra ? m.pocc.date : (m.occ && m.occ.date)) || '';
  const mPlace = m => (m.isExtra ? m.pocc.place : (m.loc && m.loc.name)) || '';
  const mSource = m => m.isExtra ? m.pocc.papers.map(i => PAPERS[i].short).join(', ') : 'Kaya vd. (2019)';
  const fmtKm = d => d < 1000 ? `${Math.round(d)} m` : `${(d / 1000).toFixed(d < 10000 ? 1 : 0)} km`;

  function goToMarker(m) {
    if (!visible.has(m.options.cat) || (m.isExtra ? !extraOn : !litOn)) ensureVisible(m.options.cat);   // kategori/katman kapalıysa aç
    const ll = m.getLatLng();
    map.closePopup();
    let done = false;
    const open = () => {
      if (done) return; done = true;
      // aynı koordinatta üst üste duran kayıtlar varsa yelpaze gibi açılır, sonra pencere görünür
      if (litCluster.hasLayer(m)) litCluster.zoomToShowLayer(m, () => m.openPopup()); else m.openPopup();
    };
    map.once('moveend', open);
    map.flyTo(ll, Math.max(map.getZoom(), 17), { duration: 0.8 });
    setTimeout(open, 1600);
  }

  // Bir türün tüm kayıtlarını yakınlık sırasıyla listele (her satır doğrudan koordinata gider)
  function showSpeciesList(sp) {
    const name = (sp.names && sp.names[0]) || sp.latin;
    qEl.value = name; clearQ.hidden = false;
    items = buildItems(name, { onlySpecies: sp }); drawResults();
  }

  function showLocality(l) {
    map.flyTo([l.lat, l.lng], 16);
    L.popup({ maxWidth: 290 }).setLatLng([l.lat, l.lng]).setContent(localityPopup(l)).openOn(map);
  }

  async function geocode(q) {
    toast('Yer aranıyor…');
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=tr&q=' + encodeURIComponent(q));
      const j = await r.json();
      hideToast();
      if (!j.length) { toast('Yer bulunamadı. Koordinat yazmayı dene.'); return; }
      items = j.map(p => ({
        tag: 'Yer', title: p.name || p.display_name.split(',')[0], sub: p.display_name,
        run: () => goTo(+p.lat, +p.lon, { label: p.name || p.display_name.split(',')[0], zoom: 14, bbox: p.boundingbox })
      }));
      drawResults();
    } catch { toast('Yer araması için internet bağlantısı gerekir.'); }
  }

  function buildItems(v, opts = {}) {
    const out = [];
    const c = opts.onlySpecies ? null : parseCoords(v);
    if (c) out.push({ tag: 'Koordinat', title: `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`, sub: 'Bu noktaya git ve işaretle', run: () => goTo(c.lat, c.lng) });

    const specRes = opts.onlySpecies
      ? [{ sp: opts.onlySpecies, matched: { text: (opts.onlySpecies.names && opts.onlySpecies.names[0]) || opts.onlySpecies.latin } }]
      : searchSpecies(v, { limit: 3, only: sp => sp.lit });
    const center = meLL || map.getCenter();
    specRes.forEach(r => {
      const ms = litMarkers.filter(m => m.sp === r.sp.lit)
        .sort((x, y) => center.distanceTo(x.getLatLng()) - center.distanceTo(y.getLatLng()));
      out.push({
        tag: 'Mantar', dot: CATS[r.sp.cat].color, title: r.matched.text,
        sub: `${r.sp.latin}${r.sp.names.length ? ' · ' + r.sp.names.slice(0, 2).join(', ') : ''} · ${ms.length ? ms.length + ' kayıt (hepsini göster)' : 'konum belirsiz'}`,
        run: () => showSpecies(r.sp)
      });
      const cap = opts.onlySpecies ? 40 : 6;
      ms.slice(0, cap).forEach(m => out.push({
        tag: 'Kayıt', dot: CATS[m.sp.cat].color, title: mPlace(m) || r.sp.latin,
        sub: [mDate(m), mSource(m), fmtKm(center.distanceTo(m.getLatLng())) + ' uzakta'].filter(Boolean).join(' · '),
        run: () => goToMarker(m)
      }));
      if (ms.length > cap) out.push({ tag: 'Kayıt', title: `… ${ms.length - cap} kayıt daha`, sub: 'Tüm kayıtları listele', run: () => showSpeciesList(r.sp), keepOpen: true });
    });

    const nq = norm(v);
    if (nq.length >= 2 && !opts.onlySpecies) {
      records.filter(r => norm(displayName(r) + ' ' + (r.latin || '')).includes(nq)).slice(0, 3).forEach(r => {
        out.push({ tag: 'Kaydım', dot: (CATS[r.cat] || CATS.supheli).color, title: displayName(r), sub: fmtDate(r.date),
          run: () => { map.flyTo([r.lat, r.lng], 16); setTimeout(() => userMarkers[r.id] && userMarkers[r.id].openPopup(), 600); } });
      });
      [...Object.values(LOC), ...PGROUPS.values()].filter(l => norm(l.name).includes(nq)).slice(0, 6).forEach(l => {
        out.push({ tag: 'Lokalite', title: l.isPaper ? l.name : `${l.no}. ${l.name}`, sub: `${l.printed}${l.alt ? ' · ' + l.alt + ' m' : ''}${l.isPaper ? ' · ' + PAPERS[l.paper].short : ''}`, run: () => showLocality(l) });
      });
    }
    if (v.length >= 3 && !c && !opts.onlySpecies) out.push({ tag: 'Yer', title: `“${v}” için yer ara`, sub: 'Köy, ilçe, adres… (internet gerekir)', run: () => geocode(v), keepOpen: true });
    return out;
  }

  function drawResults() {
    resEl.innerHTML = '';
    items.forEach((it, i) => {
      const li = el('li'); li.setAttribute('role', 'option'); li.dataset.i = i;
      const main = el('span', 'r-main');
      if (it.dot) { const d = el('span', 'r-dot'); d.style.setProperty('--c', it.dot); main.appendChild(d); }
      main.appendChild(el('span', '', it.title));
      li.append(main, el('span', 'r-tag', it.tag), el('span', 'r-sub', it.sub));
      li.addEventListener('mousedown', e => { e.preventDefault(); choose(i); });
      resEl.appendChild(li);
    });
    resEl.hidden = items.length === 0;
    qEl.setAttribute('aria-expanded', String(items.length > 0));
    act = -1;
  }
  function closeResults() { resEl.hidden = true; resEl.innerHTML = ''; items = []; act = -1; qEl.setAttribute('aria-expanded', 'false'); }
  function choose(i) {
    const it = items[i]; if (!it) return;
    if (!it.keepOpen) { closeResults(); qEl.blur(); }
    it.run();
  }

  qEl.addEventListener('input', () => {
    const v = qEl.value.trim();
    clearQ.hidden = !qEl.value;
    if (v.length < 2) { closeResults(); return; }
    items = buildItems(v); drawResults();
  });
  qEl.addEventListener('focus', () => { if (qEl.value.trim().length >= 2) { items = buildItems(qEl.value.trim()); drawResults(); } });
  qEl.addEventListener('blur', () => setTimeout(closeResults, 150));
  qEl.addEventListener('keydown', e => {
    const lis = [...resEl.children];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!lis.length) return; e.preventDefault();
      act = (act + (e.key === 'ArrowDown' ? 1 : -1) + lis.length) % lis.length;
      lis.forEach((li, i) => li.setAttribute('aria-selected', String(i === act)));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!items.length) items = buildItems(qEl.value.trim());
      choose(act >= 0 ? act : 0);
    } else if (e.key === 'Escape') { closeResults(); }
  });
  clearQ.addEventListener('click', () => {
    qEl.value = ''; clearQ.hidden = true; closeResults();
    if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
    qEl.focus();
  });

  /* =========================================================
     11) Mantar ekleme formu
     ========================================================= */
  const sheet = $('sheet'), nameInput = $('nameInput'), suggestEl = $('suggest'),
        matchEl = $('match'), matchText = $('matchText'), unknownEl = $('unknown'),
        dateEl = $('date'), habitatEl = $('habitat'), notesEl = $('notes'),
        camIn = $('photoCamInput'), galIn = $('photoGalInput'), previewEl = $('preview'), coordsEl = $('coords');

  let draft = null, matched = null, photoData = '', activeIdx = -1, results = [];
  const today = () => new Date().toISOString().slice(0, 10);

  function currentCat() { return document.querySelector('input[name="cat"]:checked').value; }
  function setCat(v) { const r = document.querySelector(`input[name="cat"][value="${v}"]`); if (r) { r.checked = true; refreshTempColor(); } }
  function refreshTempColor() { if (tempMarker) tempMarker.setIcon(pinIcon(CATS[currentCat()].color, true)); }
  document.querySelectorAll('input[name="cat"]').forEach(r => r.addEventListener('change', refreshTempColor));

  function setDraft(ll) {
    draft = { lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6) };
    coordsEl.textContent = `${draft.lat.toFixed(5)}, ${draft.lng.toFixed(5)}`;
    if (!tempMarker) {
      tempMarker = L.marker(ll, { icon: pinIcon(CATS[currentCat()].color, true), draggable: true, zIndexOffset: 1000 }).addTo(map);
      tempMarker.on('dragend', () => setDraft(tempMarker.getLatLng()));
    } else tempMarker.setLatLng(ll);
  }

  function openForm(ll) {
    resetForm(); setDraft(ll);
    sheet.classList.add('open');
    $('fabLocate').hidden = true; $('hint').hidden = true; hideLocHelp();
  }
  function closeForm() {
    sheet.classList.remove('open');
    if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
    draft = null; hideSuggest();
    $('fabLocate').hidden = false; $('hint').hidden = false;
  }
  function resetForm() {
    $('form').reset();
    dateEl.value = today(); dateEl.max = today();
    matched = null; clearPhoto();
    matchEl.hidden = true; nameInput.disabled = false;
    setCat('supheli'); hideSuggest();
    $('shareBox').hidden = !cloud.configured;
    $('shareChk').checked = true; $('privacySel').value = (typeof prefs !== 'undefined' && prefs.privacy) || 'approx'; updateShareNote();
  }
  function updateShareNote() {
    const n = $('shareNote'); if (!n) return;
    const priv = $('privacySel').value, on = $('shareChk').checked;
    $('privacySel').disabled = !on;
    n.textContent = !on ? 'Bu kayıt yalnızca bu cihazda kalır.'
      : (cloud.user ? 'Kaydedince topluluk haritasına gönderilir.' : 'Giriş yapınca topluluk haritasına gönderilir.')
        + (priv === 'exact' ? ' Tam konumun herkese görünür; toplama yerini paylaşmak istemiyorsan "Yaklaşık" seç.' : '')
        + (currentCat() === 'yenilebilir' ? ' "Yenilebilir" etiketi başkalarını etkiler; emin değilsen "Şüpheli" seç.' : '');
  }
  document.addEventListener('change', e => { if (e.target && (e.target.id === 'shareChk' || e.target.id === 'privacySel' || e.target.name === 'cat')) updateShareNote(); });

  // Açık bir popup'ı kapatan dokunuş yeni kayıt başlatmasın
  let lastPopupClose = 0;
  map.on('popupclose', () => { lastPopupClose = Date.now(); });
  map.on('click', e => {
    closeResults();
    if (Date.now() - lastPopupClose < 300) return;
    if (sheet.classList.contains('open')) setDraft(e.latlng); else openForm(e.latlng);
  });

  $('fabLocate').addEventListener('click', () => locateMe({ onFix: ll => openForm(ll) }));
  $('useGps').addEventListener('click', () => locateMe({ onFix: ll => { setDraft(ll); } }));
  $('closeSheet').addEventListener('click', closeForm);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open') && suggestEl.hidden) closeForm(); });

  /* ---- Ad arama / öneri (form) ---- */
  function hideSuggest() { suggestEl.hidden = true; suggestEl.innerHTML = ''; nameInput.setAttribute('aria-expanded', 'false'); activeIdx = -1; results = []; }

  function showSuggest() {
    const q = nameInput.value.trim();
    if (q.length < 2 || matched) { hideSuggest(); return; }
    results = searchSpecies(q);
    suggestEl.innerHTML = '';
    results.forEach((res, i) => {
      const li = document.createElement('li'); li.setAttribute('role', 'option'); li.dataset.i = i;
      const main = el('span', 's-main');
      const dot = el('span', 's-dot'); dot.style.background = CATS[res.sp.cat].color;
      main.append(dot, el('span', '', res.matched.text));
      const others = res.sp.names.filter(n => n !== res.matched.text);
      const sub = el('span', 's-sub', res.matched.kind === 'latin'
        ? (res.sp.names.join(', ') || 'Yöresel adı kayıtlı değil')
        : `${res.sp.latin}${others.length ? ' · ' + others.join(', ') : ''}`);
      li.append(main, sub);
      li.addEventListener('mousedown', e => { e.preventDefault(); pick(res); });
      suggestEl.appendChild(li);
    });
    const li = document.createElement('li'); li.setAttribute('role', 'option'); li.dataset.i = results.length;
    li.append(el('span', 's-main s-new', `“${q}” adıyla ekle`), el('span', 's-sub', 'Listede yok. Yöresel ad olarak kaydedilir.'));
    li.addEventListener('mousedown', e => { e.preventDefault(); hideSuggest(); });
    suggestEl.appendChild(li);
    suggestEl.hidden = false; nameInput.setAttribute('aria-expanded', 'true'); activeIdx = -1;
  }

  function pick(res) {
    matched = res.sp;
    nameInput.value = res.matched.kind === 'local' ? res.matched.text : (res.sp.names[0] || res.sp.latin);
    nameInput.dataset.typed = res.matched.text;
    matchText.innerHTML = '';
    const em = el('em', '', res.sp.latin);
    matchText.append('Eşleşti: ', em, res.sp.names.length ? ` · ${res.sp.names.slice(0, 2).join(', ')}` : '');
    matchEl.hidden = false; setCat(res.sp.cat); hideSuggest();
  }
  $('clearMatch').addEventListener('click', () => { matched = null; matchEl.hidden = true; nameInput.focus(); });
  nameInput.addEventListener('input', () => { if (matched) { matched = null; matchEl.hidden = true; } showSuggest(); });
  nameInput.addEventListener('blur', () => setTimeout(hideSuggest, 120));
  nameInput.addEventListener('keydown', e => {
    if (suggestEl.hidden) return;
    const lis = [...suggestEl.children];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = (activeIdx + (e.key === 'ArrowDown' ? 1 : -1) + lis.length) % lis.length;
      lis.forEach((li, i) => li.setAttribute('aria-selected', String(i === activeIdx)));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIdx >= 0 && activeIdx < results.length) pick(results[activeIdx]); else hideSuggest();
    } else if (e.key === 'Escape') { e.stopPropagation(); hideSuggest(); }
  });

  unknownEl.addEventListener('change', () => {
    if (unknownEl.checked) { matched = null; matchEl.hidden = true; nameInput.value = ''; nameInput.disabled = true; hideSuggest(); setCat('supheli'); }
    else { nameInput.disabled = false; nameInput.focus(); }
  });

  /* ---- Fotoğraf: kamera ya da galeri ---- */
  const photoDel = $('photoDel');
  async function readPhoto(f) {
    if (!f) return;
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name || '')) { toast('Lütfen bir resim dosyası seçin'); return; }
    try {
      let src = null, w = 0, hgt = 0, release = () => {};
      if (window.createImageBitmap) {
        try { const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); src = bmp; w = bmp.width; hgt = bmp.height; release = () => bmp.close && bmp.close(); } catch {}
      }
      if (!src) {
        const url = URL.createObjectURL(f);
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
        src = img; w = img.naturalWidth; hgt = img.naturalHeight; release = () => URL.revokeObjectURL(url);
      }
      const k = Math.min(1, 900 / Math.max(w, hgt));
      const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(hgt * k);
      cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
      release();
      photoData = cv.toDataURL('image/jpeg', 0.72);
      previewEl.src = photoData; previewEl.hidden = false; photoDel.hidden = false;
    } catch { toast('Fotoğraf okunamadı. Başka bir resim deneyin.'); }
  }
  function clearPhoto() {
    photoData = ''; previewEl.hidden = true; previewEl.removeAttribute('src'); photoDel.hidden = true; camIn.value = ''; galIn.value = '';
  }
  $('photoCam').addEventListener('click', () => camIn.click());
  $('photoGal').addEventListener('click', () => galIn.click());
  photoDel.addEventListener('click', clearPhoto);
  [camIn, galIn].forEach(inp => inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.value = ''; readPhoto(f); }));

  /* ---- Kaydet ---- */
  $('save').addEventListener('click', () => {
    if (!draft) { toast('Önce haritada bir nokta seç'); return; }
    const typed = nameInput.value.trim(), unknown = unknownEl.checked;
    if (!typed && !unknown) { toast('Bir ad yaz ya da “Adını bilmiyorum” kutusunu işaretle'); nameInput.focus(); return; }

    const rec = {
      id: uuid(),
      lat: draft.lat, lng: draft.lng,
      latin: matched ? matched.latin : '',
      localName: unknown ? '' : (matched ? (nameInput.dataset.typed && matched.names.includes(nameInput.dataset.typed) ? nameInput.dataset.typed : nameInput.value.trim()) : typed),
      status: unknown ? 'unknown' : (matched ? 'identified' : 'local_only'),
      cat: currentCat(), date: dateEl.value || today(), habitat: habitatEl.value,
      notes: notesEl.value.trim(), photo: photoData,
      createdAt: new Date().toISOString(),
      share: cloud.configured && $('shareChk').checked,
      privacy: $('privacySel').value || 'approx',
      synced: false   // çevrimiçi ve girişliyken sunucuya gönderilir
    };
    if (matched && norm(rec.localName) === norm(matched.latin)) rec.localName = '';

    records.push(rec);
    if (!persist(records)) { records.pop(); toast('Kayıt sığmadı. Fotoğrafsız tekrar dene.'); return; }
    closeForm(); renderUser(); renderCommunity();
    map.setView([rec.lat, rec.lng], Math.max(map.getZoom(), 14));
    if (rec.share) { prefs.privacy = rec.privacy; writeJSON(PREF_KEY, prefs); }
    toast(rec.share && !cloud.user ? 'Eklendi. Topluluğa göndermek için Hesap düğmesinden giriş yap.' : 'Mantar haritaya eklendi');
    updateAcctBtn(); if (rec.share) syncPending();
  });

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(hideToast, 4200); }

      w: `Zeytin mantarı (Omphalotus olearius) ile karıştırılır: o, gerçek lamellidir, kütük ya da kök dibinde yoğun kümeler oluşturur ve şiddetli mide-bağırsak zehirlenmesi yapar.` },
    { c: 'yenilebilir', latin: 'Armillaria mellea', tr: 'Bal mantarı', wiki: ['Armillaria_mellea'],
      t: `Ağaç gövdelerinde ve kütük diplerinde kümeler halinde çıkan bal sarısı renkli bir mantardır. Ağaçlarda kök çürüklüğü yapan bir parazit olarak da bilinir.`,
      i: `Spor baskısı beyazdır; sapta bir yüzük vardır; kümeler halinde yaşar; ağaç köklerinde ayakkabı bağı gibi siyah teller (rizomorf) bulunabilir.`,
      w: `İyice pişirilmelidir; bazı kişilerde mide rahatsızlığı yapar. Kütükte kümelenen kükürt mantarı (Hypholoma fasciculare) ve ölümcül Galerina marginata ile karıştırılabilir; Galerina'nın spor baskısı pas kahverengidir.` },
    { c: 'yenilebilir', latin: 'Cyclocybe cylindracea', tr: 'Kavak mantarı', wiki: ['Cyclocybe_aegerita', 'Cyclocybe_cylindracea'],
      t: `Kavak kütüklerinde ve gövdelerinde çıkan, kahverengi şapkalı, sapında yüzük bulunan bir odun mantarıdır. Gaziantep makalesinde kavak kütüklerinde kaydedilmiştir; kültürü de yapılır.`,
      i: `Spor baskısı kahverengidir, sapta yüzük vardır, odun üzerinde kümeli ya da dizi halinde büyür.`,
      w: `Odun üzerinde çıkan kahverengi sporlu türlerle, özellikle ölümcül Galerina marginata ve acı kükürt mantarıyla karıştırılabilir. Sap, yüzük ve spor baskısını mutlaka kontrol et.` },
    { c: 'yenilebilir', latin: 'Terfezia boudieri', tr: 'Çöl trüfü (Domalan)', wiki: ['Terfezia_boudieri', 'Terfezia'],
      t: `Toprak altında yetişen, yumru biçimli bir mantardır; güneşgülü (Helianthemum) türlerinin köklerinde yaşar. Gaziantep makalesine göre bölgede toplanıp tüketilir ve yerel ekonomik öneme sahiptir.`,
      i: `Baharda toprağı hafifçe kabartıp çatlatan yumrular; eti açık renkli, küçük bir patatesi andırır.`,
      w: `Yeraltı mantarlarını deneyimsiz toplamayın. Sahte trüf (Scleroderma) içi siyah-mor ve sert olduğu için ayrılır ama karıştırılması sık görülür.` },
    { c: 'yenilebilir', latin: 'Coprinus comatus', tr: 'Mürekkep mantarı (püsküllü)', wiki: ['Coprinus_comatus', 'Shaggy_mane'],
      t: `Beyaz, püsküllü ve silindir biçimli bir mantardır; yaşlandıkça lamelleri siyah mürekkep gibi erir. Çimenlerde ve yol kenarlarında çıkar. Gaziantep'te yöre halkınca tüketildiği bildirilen türlerdendir.`,
      i: `Uzun, silindirik, beyaz lifli-pullu şapka; lameller önce beyaz, sonra pembe, sonra siyah ve sıvılaşır.`,
      w: `Yalnızca genç, lamelleri henüz beyaz-pembe olan örnekleri topla ve hemen pişir. Bazı kaynaklar alkolle birlikte tüketilmemesini önerir. Yaşlı örnekleri atın.` },

    /* ---------- YENMEYEN ---------- */
    { c: 'yenmez', latin: 'Fomes fomentarius', tr: 'Kav mantarı', wiki: ['Fomes_fomentarius'],
      t: `Kayın, söğüt ve diğer geniş yapraklı ağaçların gövdesinde at nalı biçiminde, sert, odunsu kümeler yapar. İç kısmı eskiden ateş yakmak için kav olarak kullanılmıştır. Gaziantep'te söğüt kütüğünde kaydedilmiştir.`,
      i: `Gri-kahverengi, katmanlı ve çok sert kabuk; alt yüzeyi ince gözenekli; ağaca sıkıca yapışıktır.`,
      w: `Zehirli değildir ama yenmez. Doğada ağaçlar için önemli bir ayrıştırıcıdır; koparıp tahrip etmeyin.` },
    { c: 'yenmez', latin: 'Ganoderma lucidum', tr: 'Reishi (Parlak ağaç mantarı)', wiki: ['Ganoderma_lucidum'],
      t: `Vernik gibi parlak, kırmızımsı-kahverengi, böbrek biçimli odunsu bir mantardır; çürüyen kütüklerde çıkar. Doğu tıbbında geleneksel olarak kullanılır ama sert ve acı olduğu için yemek olarak tüketilmez.`,
      i: `Parlak, cilalı görünümlü şapka ve yan yerleşimli sap; ağaç üzerinde ya da dibinde çıkar.`,
      w: `Bilimsel çalışmalar sürmektedir; kendi başınıza tedavi amacıyla kullanmayın. İlaç etkileşimi olabilir.` },
    { c: 'yenmez', latin: 'Trametes versicolor', tr: 'Hindi kuyruğu', wiki: ['Trametes_versicolor'],
      t: `Ölü odunlar üzerinde çok renkli, ince, yelpaze biçimli halkalar halinde çıkar. Kauçuk gibi sert olduğu için yenmez; ekstraktları üzerinde tıbbi araştırmalar yapılmıştır.`,
      i: `Eş merkezli renkli bantlar, ince ve sert, alt yüzeyi küçük gözenekli.`,
      w: `Yenmez. Kendi başınıza çay ya da ekstrakt yapıp tedavi aracı olarak kullanmayın.` },
    { c: 'yenmez', latin: 'Geastrum pectinatum', tr: 'Yer yıldızı', wiki: ['Geastrum_pectinatum', 'Geastrum'],
      t: `Dış zarı olgunlaşınca yıldız gibi açılan, ortasında küçük bir toz torbası taşıyan bir mantardır. Çam ve meşe ormanlarında yosunlu zeminde bulunur. Yenmez.`,
      i: `Yıldız biçimli açılmış dış zar ve ortada yuvarlak spor kesesi; sıkınca toz gibi spor çıkarır.`,
      w: `Zehirli değildir ama yemeye uygun değildir. Çocukların sporları solumaması için ezilmemelidir.` },
    { c: 'yenmez', latin: 'Phallus impudicus', tr: null, wiki: ['Phallus_impudicus'],
      t: `Olgunken uzun beyaz bir sap ve ucunda çürük et gibi kokan, zeytin yeşili sümüksü bir tabaka oluşturur; kokusuyla sinekleri çeker. Önce yumurta biçimli genç evresinde görünür.`,
      i: `Beyaz süngerimsi sap, uçta kokulu sümüksü tabaka ve tabanda beyaz torba.`,
      w: `Yaygın uygulama değildir; genç "yumurta" evresi bazı yerlerde yenilse de deneyimsizler için önerilmez.` },

    /* ---------- ZEHİRLİ ---------- */
    { c: 'zehirli', latin: 'Amanita muscaria', tr: 'Sinek mantarı', wiki: ['Amanita_muscaria'],
      t: `Kırmızı şapkası üzerinde beyaz benekler bulunan, masal kitaplarındaki ünlü mantar. Çam ve huş ormanlarında yetişir. Sinir sistemini etkileyen maddeler içerir (sersemlik, kusma, hayal görme, kasılma).`,
      i: `Kırmızı ya da turuncu şapka, üzerinde beyaz siğil benzeri pullar, sapta yüzük, tabanda şişkin soğansı kaide.`,
      w: `Yenmez; kurutma ya da pişirme tamamen güvenli kılmaz. Çocuklar ve evcil hayvanlar için tehlikelidir. Ölümcül Amanita türleriyle aynı cinstendir.` },
    { c: 'zehirli', latin: 'Amanita pantherina', tr: 'Panter mantarı', wiki: ['Amanita_pantherina'],
      t: `Kahverengi şapkalı, üzerinde beyaz ben benzeri pullar bulunan bir amanitadır. Sinek mantarına benzer toksinler içerir; ciddi sinir sistemi belirtileri yapabilir.`,
      i: `Beyaz benekli kahverengi şapka; sapta yüzük; sap tabanında çıkıntılı halka biçimli kaide.`,
      w: `Yenilebilir "kahverengi" mantarlarla (ör. Amanita rubescens) karıştırılabilir. Amanita cinsinin hiçbir türünü toplayıp yeme.` },
    { c: 'zehirli', latin: 'Agaricus xanthodermus', tr: 'Sarı lekeli şampinyon', wiki: ['Agaricus_xanthodermus'],
      t: `Beyaz bir şampinyona çok benzer ama sap tabanı ve şapka kenarı sıkılınca ya da kesilince hızla sarıya döner. Pişerken ilaç ya da mürekkep gibi kimyasal bir koku yayar. Mide-bağırsak zehirlenmesi yapar. Gaziantep makalesinde kayıtlıdır.`,
      i: `Sap tabanında canlı sarı renk, fenol kokusu, pişirince ağır koku.`,
      w: `Çayır mantarıyla karıştırılan en yaygın zehirli şampinyondur. Tabanı sararan, fenol kokulu şampinyonları atın.` },
    { c: 'zehirli', latin: 'Omphalotus olearius', tr: 'Zeytin mantarı', wiki: ['Omphalotus_olearius'],
      t: `Zeytin, meşe ve diğer ağaçların dibinde ve kütüklerinde turuncu, yoğun kümeler halinde çıkar; karanlıkta hafif parlayabilir. Horoz mantarına benzetilir. Şiddetli kusma, ishal ve karın krampı yapar. Gaziantep makalesinde meşe kütüğü üzerinde kaydedilmiştir.`,
      i: `Gerçek lameller (kıvrım değil), turuncu renk, kütük ya da kök bağlantılı yoğun küme, sapı tabana doğru daralır.`,
      w: `Horoz mantarı ya da istiridye mantarı sanılabilir. Turuncu kümeli kütük mantarlarını toplama.` },
    { c: 'zehirli', latin: 'Hypholoma fasciculare', tr: 'Kükürt mantarı', wiki: ['Hypholoma_fasciculare'],
      t: `Kütük ve kök diplerinde sık demetler halinde çıkan, kükürt sarısı şapkalı, çok acı tadlı bir mantardır. Mide-bağırsak zehirlenmesi yapar; ağır vakalar bildirilmiştir. Gaziantep'te meşe kütüğü çevresinde kaydedilmiştir.`,
      i: `Sarı-yeşilimsi lameller, mor-kahve spor baskısı, acı tat.`,
      w: `Bal mantarı ve kavak mantarıyla karışabilir. Spor baskısını al ve tat farkına güvenme; tadına bakmak güvenli bir test değildir.` },
    { c: 'zehirli', latin: 'Lactarius torminosus', tr: null, wiki: ['Lactarius_torminosus'],
      t: `Şapkası pembemsi-turuncu, kenarı yünlü-kıllı ve içe kıvrık, beyaz süt salgılayan bir mantardır. Huş ve meşe altında çıkar. Çiğ ya da yetersiz pişirilince mide-bağırsağı yakıcı etki yapar. Gaziantep makalesinde meşe ormanında kaydedilmiştir.`,
      i: `İçe kıvrık, lifli-kıllı şapka kenarı; beyaz yakıcı süt; halkalı pembe-turuncu şapka.`,
      w: `Kanlıca ile karıştırma: Kanlıcanın sütü beyaz değil, turuncudur.` },
    { c: 'zehirli', latin: 'Inocybe bongardii', tr: 'Lif mantarı (Inocybe)', wiki: ['Inocybe_bongardii', 'Inocybe'],
      t: `Küçük, kahverengi-krem, şapkası ortada tepecikli ve lifli çatlaklı mantarlardır. Birçok türü muskarin içerir: terleme, salya, gözyaşı, göz bebeği küçülmesi, yavaş nabız gibi bulgular yapar. Gaziantep makalesinde birkaç Inocybe türü kayıtlıdır.`,
      i: `Lifli-çatlak şapka, ortada tepecik, solgun kahverengi lameller, çoğu zaman meyvemsi ya da tuhaf koku.`,
      w: `Türlerini ayırmak uzman işidir. Küçük, soluk kahverengi, lifli şapkalı mantarların hiçbirini toplama.` },
    { c: 'zehirli', latin: 'Coprinopsis atramentaria', tr: null, wiki: ['Coprinopsis_atramentaria'],
      t: `Gri-kahverengi çan biçimli, yaşlandıkça lamelleri siyah mürekkebe dönüşen bir mantardır. Tek başına zararsız görünür, ancak yemekten önce ya da sonra günlerce alkol alınırsa yüz kızarıklığı, çarpıntı ve bulantı gibi ağır reaksiyon yapar. Gaziantep makalesinde kavak kütüğü çevresinde kayıtlıdır.`,
      i: `Gri, hafif pullu çan şapka, kümeli, lameller erir ve sıvılaşır.`,
      w: `Yenilebilir mürekkep mantarı (Coprinus comatus) ile karıştırılmamalı. Alkolle birlikte tehlikelidir.` },
    { c: 'zehirli', latin: 'Scleroderma cepa', tr: 'Sahte trüf', wiki: ['Scleroderma_cepa', 'Scleroderma'],
      t: `Yuvarlak, sert kabuklu, sapsız bir mantardır; kesince içi mor-siyah ve sert görünür. Trüf sanılarak toplanabilir ama mide-bağırsak zehirlenmesi yapar. Gaziantep makalesinde iki Scleroderma türü kayıtlıdır.`,
      i: `Kalın deri gibi kabuk, olgunlaşınca içi siyah-mor ve sert; yüzeyi pürüzlü ya da pullu.`,
      w: `Gerçek trüfün içi açık renkli ve damarlıdır. İçi kesince koyu mor-siyah olan yeraltı mantarlarını yeme.` },

    /* ---------- ÖLÜMCÜL ---------- */
    { c: 'olumcul', latin: 'Amanita phalloides', tr: 'Yeşil ölüm mantarı (Ölüm şapkası)', wiki: ['Amanita_phalloides'],
      t: `Dünyada mantar kaynaklı ölümlerin çoğundan sorumlu türdür. Şapkası zeytin yeşili-sarımsıdır, lamelleri beyazdır, sapında yüzük ve tabanında torba (volva) bulunur. Amatoksinler karaciğer ve böbreklere saldırır; pişirme, kurutma ve dondurma toksini yok etmez.`,
      i: `Beyaz lameller, sap üzerinde yüzük, sap tabanında torba biçimli kaide; şapka yeşilimsi ve ipeksi lifli.`,
      w: `Belirtiler 6-24 saat sonra başlar, sonra geçici bir "iyileşme" dönemi gelir; ardından karaciğer yetmezliği gelişir. Şüphede hemen 112 ya da hastane. Kendi başına bekleme.` },
    { c: 'olumcul', latin: 'Amanita virosa', tr: 'Yıkıcı melek (Ölüm meleği)', wiki: ['Amanita_virosa', 'Destroying_angel_(mushroom)'],
      t: `Tamamen saf beyaz, zarif yapılı ölümcül bir amanitadır. Sapı tüylü-pullu, sapta yüzük, tabanda torba bulunur. Beyaz şampinyonla ya da genç şemsiye mantarıyla karıştırılarak ölümlere yol açmıştır.`,
      i: `Her yeri beyaz; lameller beyaz; sapta yüzük; tabanda torba (kazarak çıkar).`,
      w: `Beyaz renkli, torbalı tabana sahip hiçbir "şampinyon"u yeme. Sap tabanını toprağı kazarak mutlaka kontrol et.` },
    { c: 'olumcul', latin: 'Galerina marginata', tr: 'Ölümcül galerina', wiki: ['Galerina_marginata'],
      t: `Çürüyen odun, kütük ve yosunlu kütükler üzerinde kümeler halinde çıkan küçük, bal-kahverengi bir mantardır. Amatoksin içerir; bal mantarı ve diğer odun mantarlarıyla karıştırılır. Gaziantep makalesinde çam kütüğü üzerinde kaydedilmiştir.`,
      i: `Pas kahverengi spor baskısı, sapta ince yüzük (bazen silik), küçük boy ve ahşap üzerinde çıkış.`,
      w: `Odun üzerinde çıkan küçük kahverengi mantarları yemeyin. Bal mantarının spor baskısı beyazdır; Galerina'nınki kahverengidir.` },
    { c: 'olumcul', latin: 'Conocybe filaris', tr: null, wiki: ['Conocybe_rugosa', 'Conocybe_filaris'],
      t: `Çimenlik, bahçe ve gübreli alanlarda çıkan, küçük, narin, pas-kahve şapkalı ince saplı bir mantardır. Amatoksin içerir; küçük boyutuna rağmen ölümcüldür. Gaziantep makalesinde sığır gübresi üzerinde kayıtlıdır.`,
      i: `Konik-çan şapka, çok ince sap, sapta küçük yüzük, pas kahverengi spor baskısı.`,
      w: `Çim ya da gübre üzerinde çıkan küçük, kahverengi, narin mantarların hiçbirini toplama; hepsi aynı gözüküyor.` },
    { c: 'olumcul', latin: 'Cortinarius orellanus', tr: 'Orellanus (Ölümcül örümcek mantarı)', wiki: ['Cortinarius_orellanus'],
      t: `Turuncu-pas kahverengi, orta büyüklükte bir mantardır; gençken sap üzerinde örümcek ağı gibi bir perde izi taşır. Orellanin böbrek yetmezliğine yol açar; belirtiler günler hatta haftalar sonra başlayabilir, bu nedenle zehirlenmeyi fark etmek zordur.`,
      i: `Pas turuncu-kahve renk, kalın lameller, sapta örümcek ağı izi, kokusu turp benzeri olabilir.`,
      w: `Türlerini ayırt etmek çok zordur. Pas renkli, örümcek ağı izi olan hiçbir mantarı yeme.` },
    { c: 'olumcul', latin: 'Lepiota brunneoincarnata', tr: 'Ölümcül lepiota', wiki: ['Lepiota_brunneoincarnata', 'Lepiota'],
      t: `Küçük (4-8 cm), şapkası pembemsi-kahve ince pullu, sapında yüzük izi bulunan beyaz-pembe mantardır. Çim ve bahçelerde çıkar. Amatoksin içerir; küçük bir "şemsiye mantarı" sanılabilir.`,
      i: `Küçük şapka, merkezde koyu pul, ince pullu yüzey, sapta silik yüzük.`,
      w: `Küçük şemsiye mantarlarının (Lepiota cinsi) hiçbirini toplayıp yeme; birçoğu zehirli ya da ölümcüldür.` },
    { c: 'olumcul', latin: 'Gyromitra esculenta', tr: 'Yalancı kuzugöbeği', wiki: ['Gyromitra_esculenta'],
      t: `Şapkası beyin gibi kıvrımlı, kırmızımsı-kahverengi olan bir ilkbahar mantarıdır; içi pamuksu/odacıklıdır. Çam altında çıkar. Giromitrin içerir; çiğ ya da yetersiz pişirilince ölümcül olabilir, pişirme buharı bile rahatsız edicidir.`,
      i: `Beyin gibi kıvrımlı kırmızı-kahve şapka, içi dolu ve odacıklı, sap kalın ve kıvrımlı.`,
      w: `Gerçek kuzugöbeği ile karıştırma: kuzugöbeğinin içi bomboştur, şapkası bal peteği gibidir.` }
  ];

  const RULES = [
    ['Kesin teşhis yoksa yeme', 'Mantarda "neredeyse eminim" diye bir şey yoktur. Türü yüzde yüz tanıyamıyorsan yeme; şüphede sepetten at. Bir mantarın "bir tane" bile ölümcül olabildiğini unutma.'],
    ['Tek özelliğe güvenme', 'Şapka rengi aldatır. Aynı anda bak: şapka, alt yüzey (lamel/gözenek/diken), sap, halka, sap tabanı, koku, kesince renk değişimi, spor baskısı ve yetiştiği ağaç ya da zemin.'],
    ['Mantarı kesme, tabanıyla çıkar', 'Ölümcül Amanita türlerinin en önemli ayırt edici özelliği olan torba (volva) toprak altında kalır. Mantarı hafifçe döndürerek tabanıyla birlikte çıkar ve tabanı temizlemeden önce incele.'],
    ['Türleri ayrı topla', 'Her türü ayrı kâğıt torbaya ya da sepet bölmesine koy. Plastik torba mantarı terletir ve çürütür. Tanımadığın bir mantarı yemeklik mantarların yanına koyma; parçalar karışabilir.'],
    ['Yalnızca taze ve sağlam örnekleri al', 'Kurtlanmış, ezilmiş, sümüksü, koku yapmış ya da aşırı olgunlaşmış mantarı alma. Bozulan yenilebilir mantar da zehirlenmeye yol açar.'],
    ['Çiğ yeme, iyi pişir', 'Yabani mantarların çoğu çiğ yenmez. Bazıları (kuzugöbeği, bal mantarı) ancak iyice pişirilirse güvenli olur.'],
    ['İlk kez yediğin türden az ye', 'Yenilebilir türlere de kişisel duyarlılık görülebilir. Yeni türden önce az miktar dene. Pişirmeden önce birkaç parça ayırıp buzdolabında sakla; zehirlenme durumunda teşhisi hızlandırır.'],
    ['Alkolle birlikte tüketme', 'Bazı mantarlar (özellikle mürekkep mantarları) alkolle birlikte ağır bir reaksiyon yapar. Mantarlı yemekten önce ve sonra birkaç gün alkol almayın.'],
    ['Kirli yerlerden toplama', 'Mantarlar ağır metalleri ve kirleticileri biriktirir. Yol kenarı, sanayi bölgesi, çöplük, ilaçlanan tarla ve bahçe kenarlarından toplamayın.'],
    ['Uygulama ve yapay zekâya körü körüne güvenme', 'Fotoğraftan tanıma uygulamaları, bu harita ve hatta kitaplar yanılabilir. Hiçbiri kesin teşhis yerine geçmez; emin olmadığın mantarı yerel mikoloji uzmanına ya da mantar derneğine göster.'],
    ['Çocukları ve evcil hayvanları koru', 'Çocukların yabani mantar toplamasına ve yemesine izin verme. Köpekler de zehirli mantarlardan etkilenir; yürüyüşte yakından takip et.'],
    ['Doğaya ve hukuka saygı göster', 'Orman izinlerini, toplama yasaklarını ve korunan alanları öğren; ticari toplama için izin gerekebilir. Tümünü toplama, bir kısmını sporlar için bırak. Tanımadığın ya da zehirli mantarları tekmeleyip ezme; ekosistemin parçasıdırlar.'],
    ['Güvenliğini planla', 'Haritayı çevrimdışı indir, yol bilgisini ve dönüş zamanını birine söyle. Su, telefon şarjı, uygun ayakkabı ve ilk yardım malzemesi al. Avcı sezonunda canlı renk giy; yılan ve akrebe karşı dikkatli ol.'],
