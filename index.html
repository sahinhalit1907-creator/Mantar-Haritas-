  /* ---- Görseller: önce iNaturalist (CC lisanslı), olmazsa Vikipedi (internet varken) ----
         iNaturalist fotoğraflarının boyut adı URL'de değiştirilebilir:
         original (2048 px) > large (1024 px) > medium (500 px).               */
  const IMG_KEY = 'mantarHaritasi.img.v3';
  let imgCache = {};
  try { imgCache = JSON.parse(localStorage.getItem(IMG_KEY)) || {}; } catch { imgCache = {}; }
  const saveImgCache = () => { try { localStorage.setItem(IMG_KEY, JSON.stringify(imgCache)); } catch {} };

  // Yanlış çıkan bir türün görselini elle düzeltmek için:
  //   'Boletus edulis': { urls: ['https://…/foto.jpg'], page: 'https://…', by: 'Kaynak', credit: 'Fotoğrafçı, CC BY', lic: 'CC-BY' }
  const IMG_OVERRIDE = {};

  const inatSize = (u, size) => u.replace(/\/(square|thumb|small|medium|large|original)\.([A-Za-z0-9]+)(\?.*)?$/, '/' + size + '.$2$3');
  const wikiSize = (u, w) => u.replace(/\/\d+px-/, '/' + w + 'px-');
  const inatPhoto = p => {
    const base = p.medium_url || p.url; if (!base || !p.license_code) return null;
    return { urls: [inatSize(base, 'large'), inatSize(base, 'medium')], page: p.id ? 'https://www.inaturalist.org/photos/' + p.id : '',
             by: 'iNaturalist', credit: p.attribution || '', lic: String(p.license_code).toUpperCase() };
  };

  async function fromINat(g) {
    const r = await fetch('https://api.inaturalist.org/v1/taxa?rank=species&is_active=true&per_page=6&q=' + encodeURIComponent(g.latin));
    if (!r.ok) return null;
    const j = await r.json();
    const want = g.latin.toLowerCase();
    // Yanlış tür gelmesin: ad ya da eşanlamlı ad birebir eşleşmeli
    const t = (j.results || []).find(x => (x.name || '').toLowerCase() === want || (x.matched_term || '').toLowerCase() === want);
    const info = t && t.default_photo && inatPhoto(t.default_photo);
    if (!info) return null;
    info.taxon = t.id; return info;
  }
  async function fromWiki(g) {
    for (const title of g.wiki) {
      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title) + '?redirect=true');
      if (!r.ok) continue;
      const j = await r.json();
      const th = j.thumbnail && j.thumbnail.source;
      if (th) {
        const urls = [wikiSize(th, 960), th];
        if (j.originalimage && j.originalimage.source) urls.push(j.originalimage.source);
        return { urls, page: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || '',
                 by: 'Vikipedi / Wikimedia Commons', credit: '', lic: '' };
      }
    }
    return null;
  }
  // Dönüş: bilgi nesnesi | false (hiçbir kaynakta yok) | null (çevrimdışı/hata, önbelleğe yazılmaz)
  async function getImage(g) {
    if (IMG_OVERRIDE[g.latin]) return IMG_OVERRIDE[g.latin];
    if (imgCache[g.latin] !== undefined) return imgCache[g.latin];
    try {
      const info = (await fromINat(g).catch(() => null)) || (await fromWiki(g));
      imgCache[g.latin] = info || false; saveImgCache();
      return imgCache[g.latin];
    } catch { return null; }
  }
  // Aynı türün farklı gözlemlerinden en fazla 10 fotoğraf (farklı açılar, doğru tanıma için)
  async function getGallery(g, info) {
    if (g._gal) return g._gal;
    let list = [];
    if (info && info.taxon) {
      try {
        const r = await fetch('https://api.inaturalist.org/v1/taxa/' + info.taxon);
        const j = await r.json(); const t = (j.results || [])[0];
        list = ((t && t.taxon_photos) || []).map(x => x.photo && inatPhoto(x.photo)).filter(Boolean).slice(0, 10);
      } catch {}
    }
    g._gal = list.length ? list : [info];
    return g._gal;
  }
  // Sırayla aday adreslerini dener (HD olmazsa bir alt boyuta düşer)
  function loadInto(urls, ok, fail) {
    const img = new Image(); let i = 0;
    img.referrerPolicy = 'no-referrer'; img.decoding = 'async';
    img.onload = () => ok(img);
    img.onerror = () => { i++; if (i < urls.length) img.src = urls[i]; else fail(); };
    img.src = urls[0];
  }
  function creditInto(node, info) {
    node.innerHTML = '';
    if (info.page) { const a = el('a', '', info.by); a.href = info.page; a.target = '_blank'; a.rel = 'noopener'; node.append('Görsel: ', a); }
    else node.append('Görsel: ' + info.by);
    const extra = info.credit || info.lic;
    if (extra) node.append(' · ' + extra);
  }

  /* ---- Büyük görüntüleyici (HD + galeri) ---- */
  const lbEl = $('lb'), lbStage = $('lbStage'), lbCap = $('lbCap'), lbCount = $('lbCount'), lbTitle = $('lbTitle');
  let lbList = [], lbIdx = 0, lbToken = 0;
  function lbShow() {
    const info = lbList[lbIdx], token = ++lbToken;
    lbStage.innerHTML = ''; lbStage.appendChild(el('p', 'lb-msg', 'Yükleniyor…'));
    lbCount.textContent = lbList.length > 1 ? `${lbIdx + 1} / ${lbList.length}` : '';
    $('lbPrev').hidden = $('lbNext').hidden = lbList.length < 2;
    creditInto(lbCap, info);
    loadInto(info.urls, img => { if (token !== lbToken) return; img.alt = lbTitle.textContent; lbStage.innerHTML = ''; lbStage.appendChild(img); },
      () => { if (token === lbToken) { lbStage.innerHTML = ''; lbStage.appendChild(el('p', 'lb-msg', 'Görsel yüklenemedi')); } });
  }
  async function openLightbox(g, info) {
    lbTitle.textContent = g.tr ? `${g.tr} (${g.latin})` : g.latin;
    lbList = [info]; lbIdx = 0; lbEl.hidden = false; lbShow(); $('lbClose').focus();
    const gal = await getGallery(g, info);
    if (!lbEl.hidden && gal.length > 1 && lbList.length === 1) { lbList = gal; lbIdx = 0; lbShow(); }
  }
  const closeLb = () => { lbEl.hidden = true; lbToken++; lbStage.innerHTML = ''; };
  const lbStep = d => { if (lbList.length > 1) { lbIdx = (lbIdx + d + lbList.length) % lbList.length; lbShow(); } };
  $('lbClose').addEventListener('click', closeLb);
  $('lbPrev').addEventListener('click', () => lbStep(-1));
  $('lbNext').addEventListener('click', () => lbStep(1));
  lbEl.addEventListener('click', e => { if (e.target === lbEl || e.target === lbStage) closeLb(); });
  document.addEventListener('keydown', e => {
    if (lbEl.hidden) return;
    if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') lbStep(-1); else if (e.key === 'ArrowRight') lbStep(1);
  });
  const phSvg = col => `<svg viewBox="0 0 120 90" aria-hidden="true"><path d="M14 52c0-24 21-40 46-40s46 16 46 40z" fill="${col}" opacity=".85"/><rect x="49" y="50" width="22" height="30" rx="9" fill="${col}" opacity=".5"/></svg>`;

  /* ---- Rehber arayüzü ---- */
  const guideEl = $('guide'), gBody = $('gBody');
  const TABS = [['turler', 'Türler'], ['kurallar', 'Avcılık kuralları'], ['yemek', 'Yemekler'], ['bilgi', 'Makromantarlar']];
  let gTab = 'turler', gFilter = 'hepsi', gQuery = '', gObserver = null;

  const gTabs = $('gTabs');
  TABS.forEach(([k, label]) => {
    const b = el('button', 'g-tab', label); b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.k = k;
    b.addEventListener('click', () => { gTab = k; renderGuide(); });
    gTabs.appendChild(b);
  });

  function openGuide() {
    if (sheet.classList.contains('open')) closeForm();
    map.closePopup(); closeResults();
    guideEl.hidden = false; renderGuide();
    $('closeGuide').focus();
  }
  function closeGuide() { guideEl.hidden = true; if (gObserver) { gObserver.disconnect(); gObserver = null; } }
  $('guideBtn').addEventListener('click', openGuide);
  $('closeGuide').addEventListener('click', closeGuide);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !guideEl.hidden && $('lb').hidden) closeGuide(); });

  function renderGuide() {
    [...gTabs.children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.k === gTab)));
    if (gObserver) { gObserver.disconnect(); gObserver = null; }
    gBody.innerHTML = '';
    const wrap = el('div', 'g-wrap'); gBody.appendChild(wrap);
    ({ turler: tabTurler, kurallar: tabKurallar, yemek: tabYemek, bilgi: tabBilgi })[gTab](wrap);
    gBody.scrollTop = 0;
  }

  const noteBox = (title, text, kind) => {
    const d = el('div', 'g-note' + (kind ? ' ' + kind : ''));
    if (title) d.appendChild(el('strong', '', title + ' '));
    d.append(text); return d;
  };

  /* ---- Türler ---- */
  function tabTurler(wrap) {
    wrap.appendChild(noteBox('Önemli:', 'Bu rehber kesin teşhis aracı değildir. Hiçbir fotoğraf ya da yazı, mantarı elinde tutan bir uzmanın yerini tutmaz. Emin olmadığın mantarı yeme.', 'warn'));

    const ctl = el('div', 'g-ctl');
    const q = document.createElement('input'); q.type = 'search'; q.className = 'g-q';
    q.placeholder = 'Mantar ara (Latince ya da Türkçe)'; q.value = gQuery; q.setAttribute('aria-label', 'Mantar ara');
    const chips = el('div', 'g-chips');
    const list = el('div', 'g-list');

    const chipDefs = [['hepsi', 'Hepsi', GUIDE.length, null]].concat(GCATS.map(c => [c.key, c.short, GUIDE.filter(g => g.c === c.key).length, CATS[c.key].color]));
    chipDefs.forEach(([k, label, n, col]) => {
      const b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', String(gFilter === k));
      if (col) { b.style.setProperty('--c', col); b.innerHTML = '<span class="dot"></span>'; }
      b.append(el('span', '', `${label} (${n})`));
      b.addEventListener('click', () => { gFilter = k; [...chips.children].forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); draw(); });
      chips.appendChild(b);
    });
    ctl.append(q, chips);
    wrap.append(ctl, list, el('p', 'g-foot', 'Görseller iNaturalist\'ten (Creative Commons lisanslı gözlem fotoğrafları) ve bulunamayanlar için Vikipedi/Wikimedia Commons\'tan yüklenir; her resmin altında kaynağı, fotoğrafçısı ve lisansı yazar. Kullanım için lisans koşullarına (ör. ticari olmayan kullanım) uyun. İnternet yoksa yer tutucu çizim görünür.'));
    q.addEventListener('input', () => { gQuery = q.value; draw(); });

    if ('IntersectionObserver' in window) {
      gObserver = new IntersectionObserver(entries => entries.forEach(en => {
        if (en.isIntersecting) { gObserver.unobserve(en.target); en.target._load && en.target._load(); }
      }), { root: gBody, rootMargin: '300px' });
    }

    function draw() {
      list.innerHTML = '';
      const nq = norm(gQuery);
      GCATS.forEach(c => {
        if (gFilter !== 'hepsi' && gFilter !== c.key) return;
        const items = GUIDE.filter(g => g.c === c.key && (!nq || norm(g.latin + ' ' + (g.tr || '')).includes(nq)));
        if (!items.length) return;
        const sec = el('section', 'g-cat'); sec.style.setProperty('--c', CATS[c.key].color);
        const head = el('div', 'g-cat-head');
        head.append(el('span', 'g-cat-dot'), el('h3', '', c.title), el('span', 'g-count', String(items.length)));
        sec.append(head, el('p', 'g-intro', c.intro));
        const grid = el('div', 'g-grid');
        items.forEach(g => {
          const card = guideCard(g);
          grid.appendChild(card);
          if (gObserver) gObserver.observe(card); else card._load && card._load();
        });
        sec.appendChild(grid); list.appendChild(sec);
      });
      if (!list.children.length) list.appendChild(el('p', 'g-empty', 'Eşleşen mantar bulunamadı.'));
    }
    draw();
  }

  function guideCard(g) {
    const col = CATS[g.c].color;
    const card = el('article', 'g-card'); card.style.setProperty('--c', col);

    const fig = el('figure', 'g-fig');
    const ph = el('div', 'g-ph'); ph.innerHTML = phSvg(col);
    const cap = el('figcaption', 'g-cap');
    fig.append(ph, cap); card.appendChild(fig);

    let loaded = false;
    card._load = async () => {
      if (loaded) return; loaded = true;
      cap.textContent = 'Görsel aranıyor…';
      const info = await getImage(g);
      if (!info) {
        cap.textContent = info === null ? 'Görsel için internet gerekir. Bağlanınca tekrar denenecek.' : 'Bu tür için açık lisanslı görsel bulunamadı.';
        if (info === null) loaded = false;
        return;
      }
      loadInto(info.urls, img => {
        img.alt = g.tr ? `${g.tr} (${g.latin})` : g.latin;
        ph.replaceWith(img);
        const open = () => openLightbox(g, info);
        fig.classList.add('zoom'); fig.tabIndex = 0; fig.setAttribute('role', 'button'); fig.setAttribute('aria-label', 'Resmi büyüt');
        fig.addEventListener('click', e => { if (!e.target.closest('a')) open(); });
        fig.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
        creditInto(cap, info);
      }, () => { cap.textContent = 'Görsel yüklenemedi'; loaded = false; });
    };

    const body = el('div', 'g-card-body');
    const badge = el('span', 'g-badge', CATS[g.c].label);
    const title = el('h4', '', g.tr || g.latin);
    const lat = el('p', 'g-latin');
    if (g.tr) lat.appendChild(el('i', '', g.latin)); else lat.textContent = 'Yaygın Türkçe adı yok';
    body.append(badge, title, lat);

    if (!g.tr) { /* Türkçe ad yoksa Latince başlıkta; alt satırda bilgi */ title.className = 'g-latin-title'; }

    body.appendChild(el('p', 'g-text', g.t));
    const det = document.createElement('details'); det.className = 'g-det';
    det.appendChild(el('summary', '', 'Tanıma ipuçları')); det.appendChild(el('p', '', g.i));
    body.appendChild(det);

    const warn = el('div', 'g-warn'); warn.append(el('strong', '', 'Dikkat: '), g.w);
    body.appendChild(warn);

    // Haritayla bağlantı: Gaziantep makalesinde kaydı varsa
    const sp = SPECIES.find(s => s.latin === g.latin);
    const n = sp && sp.lit ? litMarkers.filter(m => m.sp === sp.lit).length : 0;
    if (sp && sp.lit && n) {
      const b = el('button', 'btn small', `Haritada göster (${n} kayıt)`); b.type = 'button';
      b.addEventListener('click', () => { closeGuide(); if (n === 1) showSpecies(sp); else showSpeciesList(sp); });
      body.appendChild(b);
    } else if (sp && sp.lit) {
      body.appendChild(el('p', 'g-mapnote', 'Gaziantep makalesinde kayıtlı; ama lokalite numarası hatalı olduğu için haritaya konamadı.'));
    } else {
      body.appendChild(el('p', 'g-mapnote', 'Gaziantep makalesinde kaydı yok.'));
    }
    card.appendChild(body);
    return card;
  }

  /* ---- Avcılık kuralları ---- */
  function tabKurallar(wrap) {
    wrap.appendChild(el('h3', 'g-h', 'Mantar avcılığının temel kuralları'));

    const tbl = el('div', 'g-myths');

    wrap.appendChild(el('h3', 'g-h', 'Zehirlenme şüphesinde ne yapmalı?'));

    [
      'Belirtiler: bulantı, kusma, karın ağrısı, ishal, aşırı terleme ya da salya, baş dönmesi, görme bozukluğu, sarılık.',
      'Geç başlayan belirtiler (yedikten 6 saat ve sonrası) daha tehlikelidir; ölümcül türlerde ilk belirtiden sonra geçici düzelme görülebilir.',
      'Beklemeden 112\'yi ara ya da en yakın acile git. Ulusal Zehir Danışma Merkezi: 114.',
      'Yenen mantardan artık, temizlik atığı ya da fotoğraf varsa yanında götür. Aynı yemeği yiyen herkesi haberdar et.',

    ].forEach(t => ul.appendChild(el('li', '', t)));

  }

  /* ---- Yemekler ---- */
  function tabYemek(wrap) {
    wrap.appendChild(el('h3', 'g-h', 'Mantar yemekleri'));
    wrap.appendChild(noteBox('Önce güvenlik:', 'Aşağıdaki tarifler şampinyon ve istiridye gibi bilinen yenilebilir mantarlar içindir. Yabani mantarı yalnızca kesin teşhisten sonra, iyice pişirerek ve ilk seferde az miktarda yiyin.', 'warn'));

    const tips = el('div', 'g-tips');

  if (records.length) {
    map.fitBounds(L.latLngBounds(records.map(r => [r.lat, r.lng])).pad(0.3), { maxZoom: 14 });
  } else {

  /* =========================================================
     14) TOPLULUK HARİTASI (Supabase): hesap, eşitleme, paylaşılan kayıtlar, bildirme
         Ayarlar config.js içinde. Boşsa uygulama yalnızca cihazda çalışır.
     ========================================================= */
  const BUCKET = 'observation-photos';
  const DEL_KEY = 'mantarHaritasi.pendingDeletes';
  const PREF_KEY = 'mantarHaritasi.prefs';
  const readJSON = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
  const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const prefs = readJSON(PREF_KEY, { privacy: 'approx' });
  const PRIV = { approx: 'yaklaşık konum (≈1 km)', exact: 'tam konum', private: 'yalnızca ben' };

  const errText = e => {
    const m = (e && (e.message || e.error_description || String(e))) || '';
    if (/Invalid login credentials/i.test(m)) return 'E-posta ya da şifre hatalı.';
    if (/already registered|already been registered/i.test(m)) return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
    if (/Password should be at least/i.test(m)) return 'Şifre en az 8 karakter olmalı.';
    if (/Email not confirmed/i.test(m)) return 'E-postanı doğrulaman gerekiyor. Gelen kutunu kontrol et.';
    if (/rate limit|too many|over_email_send_rate_limit/i.test(m)) return 'Çok fazla deneme yapıldı. Biraz sonra tekrar dene.';
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'İnternet bağlantısı yok.';
    if (/duplicate key|23505/i.test(m)) return 'Bu işlem daha önce yapılmış.';
    return m || 'Bir hata oluştu.';
  };
  const displayNameOf = u => (u && ((u.user_metadata && u.user_metadata.display_name) || (u.email || '').split('@')[0])) || 'Mantarcı';
  const pendingCount = () => records.filter(r => r.share === true && !r.synced).length + readJSON(DEL_KEY, []).length;

  function updateAcctBtn() {
    const b = $('acctBtn'); if (!b) return;
    const nm = cloud.user ? displayNameOf(cloud.user) : '';
    b.classList.toggle('in', !!cloud.user);
    $('acctLabel').textContent = cloud.user ? nm.charAt(0).toLocaleUpperCase('tr') : '';
    $('acctIcon').style.display = cloud.user ? 'none' : '';
    $('acctDot').hidden = !(cloud.ok && cloud.user && pendingCount() > 0);
    b.title = cloud.user ? `Hesap: ${nm}` : 'Hesap ve paylaşım';
  }

  function shareLabel(r) {
    if (!cloud.configured || r.share !== true) return 'Yalnızca bu cihazda';
    if (!r.synced) return cloud.user ? 'Gönderiliyor…' : 'Giriş yapınca gönderilecek';
    return r.privacy === 'private' ? 'Sunucuda (yalnızca ben görürüm)' : `Topluluk haritasında (${PRIV[r.privacy] || PRIV.approx})`;
  }

  /* ---- Eşitleme: cihazdaki kayıtları sunucuya gönder, bekleyen silmeleri uygula ---- */
  let syncing = false;
  async function syncPending() {
    if (!cloud.ok || !cloud.user || syncing || !navigator.onLine) { updateAcctBtn(); return; }
    syncing = true; let failed = 0;
    try {
      let dq = readJSON(DEL_KEY, []);
      for (const cid of [...dq]) {
        const { error } = await cloud.sb.from('observations').delete().eq('client_id', cid);
        if (error) { failed++; continue; }
        try { await cloud.sb.storage.from(BUCKET).remove([`${cloud.user.id}/${cid}.jpg`]); } catch {}
        dq = dq.filter(x => x !== cid); writeJSON(DEL_KEY, dq);
      }
      for (const r of records.filter(x => x.share === true && !x.synced)) {
        try {
          let photo_path = null;
          if (r.photo) {
            const blob = await (await fetch(r.photo)).blob();
            photo_path = `${cloud.user.id}/${r.id}.jpg`;
            const up = await cloud.sb.storage.from(BUCKET).upload(photo_path, blob, { contentType: 'image/jpeg', upsert: true });
            if (up.error) throw up.error;
          }
          const row = {
            client_id: r.id, latin_name: r.latin || null, local_name: r.localName || null, id_status: r.status || 'local_only',
            category: r.cat, lat: r.lat, lng: r.lng, privacy: r.privacy || 'approx', found_on: r.date || null,
            habitat: r.habitat || null, notes: r.notes || null, photo_path
          };
          const { error } = await cloud.sb.from('observations').upsert(row, { onConflict: 'client_id' });
          if (error) throw error;
          r.synced = true; r.syncError = ''; persist(records);
        } catch (e) {
          failed++; r.syncError = errText(e); persist(records);
          if (/sınır/.test(r.syncError)) break;
        }
      }
    } finally { syncing = false; }
    updateAcctBtn(); renderUser();
    if (failed) toast(`${failed} kayıt gönderilemedi; sonra tekrar denenecek.`);
    loadCommunity();
  }

  function queueRemoteDelete(r) {
    if (!cloud.configured || r.share !== true || !r.synced) return;
    const q = readJSON(DEL_KEY, []); if (!q.includes(r.id)) q.push(r.id); writeJSON(DEL_KEY, q);
    updateAcctBtn(); syncPending();
  }

  /* ---- Paylaşılan (başkalarının) kayıtlar ---- */
  let commTimer = null, commLoading = false;
  function scheduleCommunity() { clearTimeout(commTimer); commTimer = setTimeout(loadCommunity, 700); }
  async function loadCommunity() {
    if (!cloud.ok || !navigator.onLine || commLoading) return;
    commLoading = true;
    try {
      const b = map.getBounds().pad(0.25);
      const S = b.getSouth(), N = b.getNorth(), W = b.getWest(), E = b.getEast();
      const { data, error } = await cloud.sb.from('public_observations').select('*')
        .gte('lat', S).lte('lat', N).gte('lng', W).lte('lng', E)
        .order('created_at', { ascending: false }).limit(1000);
      if (error) throw error;
      const inB = o => o.lat >= S && o.lat <= N && o.lng >= W && o.lng <= E;
      commData = commData.filter(o => !inB(o)).concat(data || []).slice(-4000);
      writeJSON(COMM_KEY, commData);
      renderCommunity();
    } catch { /* çevrimdışı ya da geçici hata: eldeki önbellek gösterilir */ }
    commLoading = false;
  }
  function renderCommunity() {
    commCluster.clearLayers();
    const own = new Set(records.map(r => r.id));
    const list = commData.filter(o => visible.has(CATS[o.category] ? o.category : 'supheli') && !own.has(o.client_id));
    if (commOn) {
      commCluster.addLayers(list.map(o => {
        const cat = CATS[o.category] ? o.category : 'supheli';
        const m = L.marker([o.lat, o.lng], { icon: pinIcon(CATS[cat].color), title: o.local_name || o.latin_name || 'Mantar' });
        m.bindPopup(() => communityPopup(o), { maxWidth: 290 });
        return m;
      }));
    }
    commChip.querySelector('.n').textContent = `· ${list.length}`;
  }
  const photoURL = p => `${String(CFG.SUPABASE_URL).replace(/\/+$/, '')}/storage/v1/object/public/${BUCKET}/${String(p).split('/').map(encodeURIComponent).join('/')}`;

  function communityPopup(o) {
    const cat = CATS[o.category] ? o.category : 'supheli', c = CATS[cat];
    const root = el('div', 'pop'); root.style.setProperty('--c', c.color);
    const title = o.local_name || o.latin_name || 'Adı bilinmeyen mantar';
    if (o.photo_path) { const img = el('img'); img.loading = 'lazy'; img.alt = title; img.src = photoURL(o.photo_path); root.appendChild(img); }
    root.appendChild(el('h3', '', title));
    const sub = el('p', 'latin');
    if (o.local_name && o.latin_name) sub.appendChild(el('i', '', o.latin_name)); else sub.textContent = o.id_status === 'unknown' ? 'Tespit edilmeyi bekliyor' : '';
    root.appendChild(sub);
    const badges = el('div', 'badges');
    badges.append(el('span', 'badge', c.label), el('span', 'badge src', o.verified ? 'Doğrulandı' : 'Topluluk bildirimi'));
    root.appendChild(badges);
    const dl = el('dl'); const row = (k, v) => dl.append(el('dt', '', k), el('dd', '', v));
    if (o.found_on) row('Tarih', fmtDate(o.found_on));
    if (o.habitat) row('Ortam', o.habitat);
    row('Ekleyen', o.display_name || 'Mantarcı');
    row('Konum', o.privacy === 'approx' ? 'Yaklaşık (≈1 km)' : 'Tam konum');
    root.appendChild(dl);
    if (o.notes) root.appendChild(el('p', 'note', o.notes));
    if (!o.verified) root.appendChild(el('p', 'warn', 'Bu kayıt bir kullanıcı bildirimidir ve doğrulanmamıştır. Bu bilgiye dayanarak mantar tüketmeyin.'));
    const act = el('div', 'acts'); const rb = el('button', 'btn small ghost', 'Bildir'); rb.type = 'button';
    rb.addEventListener('click', () => reportModal(o)); act.appendChild(rb); root.appendChild(act);
    return root;
  }

  /* ---- Küçük pencere (modal) ---- */
  function openModal(title) {
    const ov = el('div', 'mdl'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    const box = el('div', 'mdl-box');
    const head = el('div', 'mdl-head'); head.appendChild(el('h3', '', title));
    const x = el('button', 'icon-btn', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Kapat'); head.appendChild(x);
    const body = el('div', 'mdl-body'); box.append(head, body); ov.appendChild(box); document.body.appendChild(ov);
    const onKey = e => { if (e.key === 'Escape') close(); };
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
    document.addEventListener('keydown', onKey);
    x.addEventListener('click', close); ov.addEventListener('click', e => { if (e.target === ov) close(); });
    return { body, close };
  }
  const mkInput = (type, ph, ac) => { const i = document.createElement('input'); i.type = type; i.placeholder = ph; if (ac) i.autocomplete = ac; return i; };
  const mkField = (label, node) => { const d = el('div', 'field'); d.append(el('label', '', label), node); return d; };

  function reportModal(o) {
    if (!cloud.user) { toast('Bildirmek için giriş yap'); accountModal(); return; }
    const m = openModal('Kaydı bildir');
    m.body.appendChild(el('p', 'mdl-p', 'Yanlış, tehlikeli ya da uygunsuz bir kayıt mı? Üç farklı kullanıcı bildirirse kayıt otomatik gizlenir ve incelenir.'));
    const sel = document.createElement('select');
    ['Yanlış tür ya da kategori', 'Zehirli/ölümcül mantar yenilebilir gösterilmiş', 'Uygunsuz içerik', 'Spam', 'Konum gizliliği sorunu', 'Diğer']
      .forEach(t => { const op = document.createElement('option'); op.textContent = t; sel.appendChild(op); });
    const det = document.createElement('textarea'); det.maxLength = 300; det.placeholder = 'Ek açıklama (isteğe bağlı)';
    const msg = el('p', 'mdl-msg'); const go = el('button', 'btn', 'Gönder'); go.type = 'button';
    go.addEventListener('click', async () => {
      go.disabled = true; msg.textContent = 'Gönderiliyor…';
      const { error } = await cloud.sb.from('reports').insert({ observation_id: o.id, reason: sel.value, details: det.value.trim() || null });
      if (error) { msg.textContent = /duplicate key|23505/.test(error.message || error.code || '') ? 'Bu kaydı zaten bildirdin.' : errText(error); go.disabled = false; return; }
      toast('Bildirimin alındı, teşekkürler.'); m.close();
    });
    m.body.append(mkField('Neden?', sel), mkField('Açıklama', det), msg, go);
  }

  /* ---- Hesap penceresi ---- */
  function accountModal() {
    const m = openModal(cloud.user ? 'Hesabım' : 'Giriş yap / Kayıt ol');
    const b = m.body;
    if (!cloud.configured) {
      b.append(el('p', 'mdl-p', 'Topluluk özelliği henüz ayarlanmadı. Kayıtların şimdilik yalnızca bu cihazda saklanıyor.'),
               el('p', 'mdl-p', 'Paylaşımı açmak için KURULUM.md dosyasındaki adımları izleyip config.js içine Supabase adresini ve anahtarını yaz.'));
      return;
    }
    if (!cloud.ok) { b.append(el('p', 'mdl-p', 'Bağlantı kitaplığı yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.')); return; }
    if (!cloud.user) buildAuth(b, m.close); else buildProfile(b, m.close);
  }

  function buildAuth(body, close) {
    body.appendChild(el('p', 'mdl-p', 'Kayıt paylaşmak ve başkalarının kayıtlarını görmek için hesap aç. E-posta adresin kimseye gösterilmez; yalnızca görünen adın paylaşılır.'));
    const email = mkInput('email', 'E-posta', 'email'), pass = mkInput('password', 'Şifre (en az 8 karakter)', 'current-password'), name = mkInput('text', 'Görünen ad (kayıt olurken)', 'nickname');
    name.maxLength = 40;
    const msg = el('p', 'mdl-msg');
    const bIn = el('button', 'btn', 'Giriş yap'), bUp = el('button', 'btn ghost', 'Kayıt ol'); bIn.type = bUp.type = 'button';
    const run = async mode => {
      msg.textContent = '';
      const em = email.value.trim(), pw = pass.value;
      if (!/^\S+@\S+\.\S+$/.test(em)) { msg.textContent = 'Geçerli bir e-posta yaz.'; return; }
      if (pw.length < 8) { msg.textContent = 'Şifre en az 8 karakter olmalı.'; return; }
      if (mode === 'up' && name.value.trim().length < 2) { msg.textContent = 'Görünen adını yaz (en az 2 harf).'; return; }
      bIn.disabled = bUp.disabled = true; msg.textContent = 'Lütfen bekle…';
      try {
        const res = mode === 'in'
          ? await cloud.sb.auth.signInWithPassword({ email: em, password: pw })
          : await cloud.sb.auth.signUp({ email: em, password: pw, options: { data: { display_name: name.value.trim().slice(0, 40) } } });
        if (res.error) throw res.error;
        if (mode === 'up' && !(res.data && res.data.session)) msg.textContent = 'Kayıt alındı. E-postana gelen doğrulama bağlantısına tıkla, sonra giriş yap.';
        else { toast('Giriş yapıldı'); close(); }
      } catch (e) { msg.textContent = errText(e); }
      bIn.disabled = bUp.disabled = false;
    };
    bIn.addEventListener('click', () => run('in')); bUp.addEventListener('click', () => run('up'));
    const acts = el('div', 'acts'); acts.append(bIn, bUp);
    body.append(mkField('E-posta', email), mkField('Şifre', pass), mkField('Görünen ad', name), msg, acts,
      el('p', 'mdl-small', 'Kayıt olarak paylaştığın kayıtların başkaları tarafından görüleceğini kabul edersin. Kayıtlar kullanıcı bildirimidir; kesin teşhis değildir.'));
  }

  function buildProfile(body, close) {
    body.appendChild(el('p', 'mdl-p', `${displayNameOf(cloud.user)} · ${cloud.user.email || ''}`));
    const stats = el('p', 'mdl-small');
    const refresh = () => {
      const shared = records.filter(r => r.share === true && r.synced).length;
      stats.textContent = `Cihazda ${records.length} kayıt · ${shared} tanesi paylaşıldı · ${pendingCount()} işlem bekliyor`;
    };
    refresh(); body.appendChild(stats);

    const sel = document.createElement('select');
    [['approx', 'Yaklaşık konum (≈1 km kaydırılmış)'], ['exact', 'Tam konum'], ['private', 'Sadece ben göreyim']].forEach(([v, t]) => { const op = document.createElement('option'); op.value = v; op.textContent = t; sel.appendChild(op); });
    sel.value = prefs.privacy || 'approx';
    sel.addEventListener('change', () => { prefs.privacy = sel.value; writeJSON(PREF_KEY, prefs); });
    body.appendChild(mkField('Yeni kayıtlar için varsayılan konum görünürlüğü', sel));

    const acts = el('div', 'acts');
    const bSync = el('button', 'btn', 'Şimdi eşitle'); bSync.type = 'button';
    bSync.addEventListener('click', async () => { toast('Eşitleniyor…'); await syncPending(); refresh(); });
    acts.appendChild(bSync);
    const legacy = records.filter(r => r.share !== true).length;
    if (legacy) {
      const bOld = el('button', 'btn ghost', `Cihazdaki ${legacy} kaydı da paylaş`); bOld.type = 'button';
      bOld.addEventListener('click', () => {
        if (!confirm(`Cihazdaki ${legacy} kayıt topluluk haritasında (seçtiğin konum görünürlüğüyle) paylaşılacak. Devam edilsin mi?`)) return;
        records.forEach(r => { if (r.share !== true) { r.share = true; r.privacy = r.privacy || prefs.privacy || 'approx'; r.synced = false; } });
        persist(records); bOld.remove(); syncPending().then(refresh);
      });
      acts.appendChild(bOld);
    }
    const bOut = el('button', 'btn ghost', 'Çıkış yap'); bOut.type = 'button';
    bOut.addEventListener('click', async () => { await cloud.sb.auth.signOut(); toast('Çıkış yapıldı. Kayıtların cihazında duruyor.'); close(); });
    acts.appendChild(bOut);
    body.appendChild(acts);

    const danger = el('button', 'btn danger', 'Paylaştığım tüm kayıtları sunucudan sil'); danger.type = 'button';
    danger.addEventListener('click', async () => { await deleteAllShared(); refresh(); });
    body.append(danger, el('p', 'mdl-small', 'Hesabını tamamen silmek için yönetici ile iletişime geç. Paylaştığın kayıtların e-posta adresin olmadan, yalnızca görünen adınla gösterilir.'));
  }

  async function deleteAllShared() {
    if (!confirm('Topluluk haritasında paylaştığın TÜM kayıtlar ve fotoğrafları sunucudan silinecek. Cihazındaki kayıtlar kalır. Devam edilsin mi?')) return;
    const uid = cloud.user.id;
    const { error } = await cloud.sb.from('observations').delete().eq('user_id', uid);
    if (error) { toast(errText(error)); return; }
    try {
      const { data } = await cloud.sb.storage.from(BUCKET).list(uid, { limit: 1000 });
      if (data && data.length) await cloud.sb.storage.from(BUCKET).remove(data.map(f => `${uid}/${f.name}`));
    } catch {}
    records.forEach(r => { r.synced = false; r.share = false; }); persist(records); writeJSON(DEL_KEY, []);
    updateAcctBtn(); renderUser(); loadCommunity(); toast('Paylaştığın kayıtlar silindi.');
  }

  /* ---- Başlangıç ---- */
  $('acctBtn').addEventListener('click', accountModal);
  updateAcctBtn();
  if (cloud.ok) {
    cloud.sb.auth.getSession().then(({ data }) => {
      cloud.user = (data && data.session) ? data.session.user : null; updateAcctBtn(); if (cloud.user) syncPending();
    }).catch(() => {});
    cloud.sb.auth.onAuthStateChange((evt, session) => {
      cloud.user = session ? session.user : null;
      setTimeout(() => { updateAcctBtn(); if (cloud.user) syncPending(); }, 0);   // geri çağrının içinde Supabase çağrısı yapma
    });
    map.on('moveend', scheduleCommunity);
    window.addEventListener('online', () => { syncPending(); loadCommunity(); });
    loadCommunity();
  }
  renderCommunity();


  /* =========================================================
     15) PWA: kurulum düğmesi, çevrimdışı bildirimi, service worker
         (yalnızca https ya da localhost'ta çalışır; content:// ve file:// 'da kayıt yapılmaz)
     ========================================================= */
  let installEvt = null;
  const installChip = el('button', 'chip'); installChip.type = 'button'; installChip.hidden = true; installChip.textContent = 'Uygulamayı yükle';
  installChip.addEventListener('click', async () => {
    if (!installEvt) return;
    installEvt.prompt();
    try { await installEvt.userChoice; } catch {}
    installEvt = null; installChip.hidden = true;
  });
  filtersEl.appendChild(installChip);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; installChip.hidden = false; });
  window.addEventListener('appinstalled', () => { installChip.hidden = true; toast('Uygulama yüklendi'); });
  window.addEventListener('offline', () => toast('İnternet yok. Kayıtların bu cihazda saklanır.'));
  window.addEventListener('online', () => toast('İnternet geri geldi.'));
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
